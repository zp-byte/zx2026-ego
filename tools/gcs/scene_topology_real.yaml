# =============================================================================
# scene_topology_real.yaml — 科目三 真机场地拓扑（GPS 口径，2026-10-11 换血）
# =============================================================================
# 【坐标源头链】官方 docx（桌面《比赛坐标》两份，度分秒）→
#   src/zx2026_common/config/venue_gps.yaml（官方原始数唯一真值，禁写派生数）
#   → geo_enu.frame_from_venue（锚点=起降区 4 点均值，2026-10-09 定谳不改）
#   → tools/gcs/venue_real_gen.py（派生数唯一入口）
#   → 本文件全部 ENU 数。
# 手改任何 ENU 数都过不了 `python3 tools/gcs/venue_real_gen.py --check`
# （deploy_real.sh 部署闸实跑）。
#
# 【口径】
#   - 官方飞行区 = 8 点不规则周界（约 221m×423m，基准海拔 71m RTK 仅高度
#     参考）；起降区 = 周界点 1-2-3-8（约 40×39m，西北角）；补给区 = 4 点
#     （约 34×19m，东南部）。高度全是相对米（起飞地面=0），GPS 只进水平面。
#   - ENU 原点 = 起降区中心，x=东 y=北。venue.size 是【栅格覆盖口径】非
#     场地物理尺寸：nav 栅格中心硬编码 0（g_x0=-size/2），size 须双向罩住
#     全部坐标 +5m 边距；res 0.5 下 grid 约 820×1644=1.35M 格。
#   - 投放点 xyz 的 z=1.5 是【释放悬停高度】审计口径（executor 不消费
#     dp.xyz 的 z，行为高度全走 competition_rules heights）。
#   - 真机占用感知 = 激光点云闭环（cloud_adapter 四道滤→nav 建图），Scene
#     树表留空不建模树——本文件零 forest 段是有意设计（部署探针有断言）。
#   - WSL sim 永远跑 config/ 原文件，本文件经 deploy_real.sh 换名上机
#     （scene.py:92 硬编码文件名，与 sim_settings 换名同款套路），不影响
#     仿真一分。
#
# 【50×50 旧口径已废止】2026-09-26 场地视频口径的占位模型（drop [50,0/2/4]、
#   fence 50 边线、crossing 15..45）——官方周界比它大一个量级，凡按旧口径
#   推的点位与断言全部由本轮 GPS 派生数取代（deploy/_test_real_chain 同步）。
#
# ⚠ 起飞前必测（--check 全绿不等于现场零误差）：
#   1. 巡航高度 2.4m 处 D435 对平台色标的实检横向带宽（点阵行距 1.5m 按
#      color 窄轴 42.5°@2.4m 交轨带 1.87m×0.8 推得——真机光照/相机安装
#      角下须实飞核验；实检带更宽则改 venue_real_gen 行距重派生减行提速，
#      更窄则加密）
#      跑 `python3 tools/gcs/venue_real_gen.py --emit-xyz` 把打印的 xyz
#      贴回本文件，--check 复绿
#   2. odom_tf 三参 yaw0_deg/ex0/ny0 逐机装订（real_d435.launch：ex0/ny0
#      =各机上电桩位在本 ENU 的坐标，yaw0=机头相对正东的偏角）。GPS 返航
#      修正通道（gps_home_node，锚点在 offset 中相消）可吸收 ex0/ny0 小
#      误差；yaw0 必须现场对准——它错则目标点整体旋转
#   3. pad 桩位复核（下方 6 点由起降区 quad 3×2 派生；实际以现场划线为准，
#      挪桩即改 pad_origin/pad_spacing 并重跑 --check）
#   4. crossing_zone 是派生假定（规则原文无穿越区坐标）——现场核对走廊
#      南北缘与实际林区边界
# =============================================================================

venue:
  # 栅格覆盖口径（见头注），非场地物理尺寸
  size: [410, 822, 6]
  ground_z: 0.0

zones:
  - id: takeoff
    kind: pad
    polygon: [[-22.17, 19.03], [-13.17, -14.87], [17.67, -20.1], [17.67, 15.94]]
    pads: 6
    pad_spacing: [4.0, 4.0]
    pad_origin: [-6.25, -2.54]   # 3×2 块中心=起降区 quad 外接框心（派生）
  - id: transit
    kind: open_field          # 非 forest=零树（真机占用=点云，勿改回 forest）
    polygon: [[-22.17, 19.03], [-13.17, -14.87], [17.67, -20.1], [-6.23, -310.34], [57.77, -401.24], [172.66, -405.24], [199.39, 3.31], [17.67, 15.94]]
  - id: return
    kind: ref
    ref: takeoff

# ---- 穿越区（EXECUTE 首腿飞向其重心；crossed 判定/via_slots 候选域） --------
# 派生假定走廊：起降区南缘外推 10m 到补给区北缘外推 10m、场地东西界内
# （⚠ 头注必测 4）
crossing_zone:
  polygon: [[16.85, -30.1], [197.2, -30.1], [176.4, -348.1], [20.35, -348.1]]

# ---- 颜色权威源（三端共用，禁另设硬编码色表） --------------------------------
color_map:
  TYPE_A: red
  TYPE_B: blue
  TYPE_C: yellow

# ---- 投放区搜索点阵（2026-10-11 用户定谳：投放平台是一个区域，在区域
# 里面搜寻——官方只给补给区周界不给平台点） ------------------------------------
# 以下 14 锚点是 RECON 扫描航路：沿补给区长轴 mower 铺行（行距 1.5m=
# D435 color 窄轴 42.5°@巡航 2.4m 交轨带 1.87m×0.8），途中检测承担行
# 覆盖、末轮退化回逐锚点悬停确认——非平台精确点。type/color 仅 fallback
# 审计用（闭环下平台由机载颜色识别择定）。xyz↔gps 严格互证；改点阵走
# venue_real_gen 重派生重贴，勿手改单字段。
