# ---- 静态障碍物（场界反应带：perimeter bbox 四边条带，保守外近似） -----------
# 真场无物理围网——此四面 fence 是 boundary_margin 反应层的边界带（z 0..3.0
# 覆盖 cruise 2.4/悬停 1.5），不进 A* 占用（collides_xy 跳过）；斜边外越
# 界由 rules geofence 8 点多边形（判分口径）+ PX4 GF_*（FCU 兜底）双层管。
static_obstacles:
  - kind: fence
    lo: [-22.47, -405.54, 0.0]
    hi: [-22.17, 19.33, 3.0]
  - kind: fence
    lo: [199.39, -405.54, 0.0]
    hi: [199.69, 19.33, 3.0]
  - kind: fence
    lo: [-22.47, -405.54, 0.0]
    hi: [199.69, -405.24, 3.0]
  - kind: fence
    lo: [-22.47, 19.03, 0.0]
    hi: [199.69, 19.33, 3.0]
