# =============================================================================
# competition_rules_real.yaml — 科目三 真机比赛细则（非凸α 实机，2026-09-26）
# =============================================================================
# 部署：deploy_real.sh 拷机载换名 src/zx2026_common/config/competition_rules.yaml
#（executor/nav 均 cfg.load 硬编码文件名）。WSL sim 跑 config/ 原文件，本文件
# 不影响仿真一分。
# 与 sim 版差异：time_limit 1500 / heights 真机链 / geofence 真场 /
# return_through_forest false / color_id.region_search true+L18 三开 /
# type_match.position_gate false（区域锁存位≠锚点，true=MATCH 全灭）。
# ⚠ 从 sim 同步细则时严禁整块覆盖 color_id/type_match——两处默认值与
# sim 相反，抹键=静默回归（三道闸 _test_real_chain/机上探针已钉，会炸）。
# =============================================================================

time_limit_s: 1500         # 真机规则原文 25 分钟=1500s（sim 压缩口径 180 勿带上机）
phase_timeout_s: 60        # P3 起飞阶段超时（含错峰延迟）
takeoff_stagger_s: 3.0     # 多机错峰起飞间隔(s)：drone i 延迟 i*stagger
entry_stagger_s: 2.5       # P4 进入错峰间隔(s)：drone i 延迟 i*stagger
return_stagger_s: 3.0      # 返航错峰间隔(s)：drone i 投放后延迟 i*stagger 再返航

# ---- 飞行高度约定（真机链，用户定谳 2026-09-26：平台贴地，1.5=释放悬停高） ----
heights:
  takeoff_hover_z: 1.5     # 起降区悬停
  cruise_z: 2.4            # 【现场定谳 2026-09-27】场地 2m 以下有灌木丛——巡航提到
                           # 灌木顶+0.4 裕度；RECON 扫描带自动 [1.9,2.9]、返航悬停
                           # 同步升高（顺带消 RECON 贴线病灶）；投放段 identify/
                           # drop 保持 1.9/1.5（投放点现场清障区）
  identify_z: 1.9          # 投放点正上方识别/缓冲高度 = hover 1.5 + 0.4
                           #（与 sim 0.8+0.4=1.2 同一缓冲律）
  flight_z_ceiling: 4.5    # nav goal z 钳位（0=不钳）；距 OVER_HEIGHT 5.0 保 0.5m
  drop_hover_z: 1.5        # 【用户定谳 2026-09-26】释放悬停高度=1.5。
                           # 注意：sim 旧注释曾记"真机按规则原文 50~60cm 复核"，
                           # 已被本口径取代；若比赛规则原文确限 0.55，只改这一行
  drop_hover_tol: 0.62     # 精投放到位阈值(m)（sim 定谳值沿用；真机 LIO 漂移
                           # 预期小于 sim 注入漂移，只松不紧）
  drop_release_tol: 0.35   # 释放对准门阈值(m)
  drop_align_timeout_s: 6.0  # 对准兜底放行(s)
  drop_mid_z: 1.70         # GOTO_LO 中继高度：1.9→1.7→1.5 三段 ~0.2m 温和递降
                           # 消 P 环过冲（与 sim 同律）；<=0 退回两段
  drop_arrival_tol: 0.8    # 投送平台水平到位阈值(m)
  area_arrival_tol: 2.0    # 区域到位阈值(m)

# ---- 颜色识别闭环（规则口径：平台色-类型对应赛前不告知） -----------------------
color_id:
  enabled: true
  source: camera           # 真机 D435 下视相机 HSV（color_detector 通用件同码）
  scan_dwell_s: 2.0
  min_conf: 0.8
  n_frames: 3
  max_scan_rounds: 2
  scan_leg_timeout_s: 45
  # ---- 区域搜索臂（2026-10-11 用户定谳：投放平台是一个区域，在区域里面
  # 搜寻——官方只公布补给区周界，平台位置不公布） -------------------------------
  # drop_points=mower 搜索点阵（venue_real_gen 派生，scene_topology_real
  # 14 锚点）：RECON 的 GOTO_HI 腿途中连续跑同款 bucket 检测，n_frames
  # 连拍自色即锁「当拍 odom=平台心」（误差≈3 帧×地速 ~0.2m << drop_tol）
  # 转降悬停确认；非末轮途经锚点不降（覆盖靠途中检测的行覆盖），末轮
  # 退化回逐锚点悬停确认。sim 规则无此键=恒 False=sim 零行为变更
  # （区域搜索的 sim A/B 另案立案）。
  region_search: true
  # ---- RECON 提速 L18 臂（sim 三臂终判 17 局：三开 5/5 过闸翻默认） --------
  exclusion_memory: true   # L1：dwell 零命中+末拍高置信异色→本局排除不重访
  exclude_min_conf: 0.9    # L1 采集置信门（T 臂实测异色确认 conf 0.93-0.94）
  first_leg_exempt: true   # 首腿豁免：真机首腿=越场全程 ~390m@2m/s≈195s，
                           # 45s 帽必强断（ego T 臂 12/12 同型）——真机几何下必开
  # nearest_first 刻意不开（与 sim L18g 形态的唯一偏离，已记账）：L8 按距
  # 离重排起扫序会撕碎 mower 行序=搜索带覆盖失效。真机腿长 ~31m@2m/s≈16s
  # 对 45s 帽裕度 2.8×，且途中锁定优先于腿帽（找到平台的腿不被弃），
  # L19a 烧穿机制（短腿+排除塌缩+45s 帽）在真机几何下不成立。
  # ---- R2 claim_color_gate（2026-10-12 sim A/B 收官翻默认；同日真机端口）----
  # 异色认领跳台：色表=各机实际箱色广播（/drone_<j>/mission/box_color）——
  # 真机指派是人工 mission_loader 文件可偏离分配律，静态律推导在真机必错，
  # 广播值=唯一权威（sim 单 master 下广播值=分配律值逐位等价，A/B 结论
  # 平移不受影响）。认领/完成/箱色/邻机位置四话题经 agent→hub fleet 下行
  # 转本 master（真机各机独立 master，executor 直订他机话题原本无源），
  # 周期重发=认领 TTL 心跳。
  # sim 定谳：DONE med 237→197.3s(−16.7%)、5×满分、12 跳台全异色零误杀。
  # 真机暂 false——信道已建成待真机多机 RECON margin 实测后翻 true；
  # 语义与 sim 全同（同代码）。
  claim_color_gate: false
  # 认领 TTL=心跳语义（真机端口 2026-10-12）：fleet 下行周期重发持续刷新
  # _claims_t，120s 只在「认领后重发静默 120s」时清僵尸——静默两源=链路
  # 死亡（出 fleet 快照）∨ 机入终相停发（agent DP_RELEASE_PHASES 门：失败/
  # 自愈返航机不发 done 也不清认领，照旧重发会被 5Hz 永久刷新堵死同色
  # 伙伴；README §10 释放三径）。合法投放锁最长 ~45s（下降+对准+释放），
  # 裕度 2.6×。sim 保持 0（单 master done 事件必达，无僵尸形态）。未开
  # gate 时本键也生效于 holder 仲裁（WAIT_HI 白等 90s×轮数的泄漏防护）。
  claim_ttl_s: 120
  settle_gate: true
  settle_window_s: 0.8
  settle_tol_m: 0.10
  arrive_gate: true
  camera_detector:         # image_topic 走 real_fleet.launch camera_topic 参数；
                           # hsv 初值沿用 sim 标定，真机按光照重标（D435 现场标定项）
    image_topic: camera/image_raw
    stale_s: 0.4
    min_blob_area_px: 40
    hsv:
      red_lo1: 0
      red_hi1: 8
      red_lo2: 172
      red_hi2: 179
      blue_lo: 100
      blue_hi: 115
      yellow_lo: 20
      yellow_hi: 35
      s_min: 120
      v_min: 80
    conf:
      w_circularity: 0.6
      w_purity: 0.4
      w_area: 0.0
      area_floor_px: 40

# ---- 运动限制 ---------------------------------------------------------------
motion:
  default_max_vel: 2.0
  default_max_acc: 4.0
  cruise_above_canopy: true

# ---- 类型匹配安全策略 ---------------------------------------------------------
type_match:
  min_confidence: 0.8
  consecutive_frames: 3
  hover_timeout_s: 12.0
  unknown_tag_policy: ignore
  position_gate: false     # 区域搜索锁存位≠锚点 dp.xyz（可达半个格距），
                           # 0.8m 位置门会拒尽 MATCH=释放链卡死。颜色权威
                           # 链不变（min_conf 0.8+连拍；锁存沿已过同款门，
                           # AT_DROP 悬停再确认一轮）

# ---- 投放点 Tag 检测参数 ------------------------------------------------------
tag_detection:
  tag_range: 4.0
  fov_deg: 60.0
  occlusion: true

# ---- 计分（科目三比赛口径：S = S1 + S2，满分 100；机载只作内部指标） -----------
score:
  s1_per_correct: 10
  s1_cap: 60
  s2_ladder:
    6: 40
    5: 30
    4: 25
    3: 15
    2: 10
    1: 5
    0: 0
  drop_tol_m: 0.6         # 平台投影判平台半径（平台直径 1.2m——真机平台尺寸实测后复核）
  wrong_drop_penalty: 0
tiebreak: [total_score, completion_time, first_correct_drop_time]

# ---- 合规监视（rule_monitor，P5：退赛条款） ----------------------------------
rule:
  enabled: true
  # 官方 8 点飞行区周界 ENU（venue_gps.yaml→geo_enu→venue_real_gen.py 派生，
  # 2026-10-11 GPS 口径；判分口径=出多边形即 OOB，斜边不再用矩形外扩近似；
  # 与 scene_topology_real 的四面 bbox fence 是两层：此管判分退赛、彼管反应推力）
  geofence: [[-22.17, 19.03], [-13.17, -14.87], [17.67, -20.1], [-6.23, -310.34], [57.77, -401.24], [172.66, -405.24], [199.39, 3.31], [17.67, 15.94]]
  out_of_bounds_grace_s: 10.0
  ground_contact_z: 0.30
  unauthorized_landing_grace_s: 1.5
  max_height_m: 5.0
  height_grace_s: 2.0
  return_through_forest: false   # 真场无林带（返航走廊推导依赖树林外接框，关）
  corridor_margin_m: 1.0
  return_corridor: []
  retire_on_corridor_miss: false
  retire_score_keep: true
  selftest_inject: false
