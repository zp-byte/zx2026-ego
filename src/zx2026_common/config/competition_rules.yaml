# =============================================================================
# competition_rules.yaml — 评分细则 / 高度约定 / 阶段时限
# 细则更新时只改本文件。
# =============================================================================

time_limit_s: 250          # 科目总时限。【2026-10-08 用户裁决：180→250，恢复 ego 线
                           # 原值】250 本即本线原值——HEAD c9b7888「pre-arena-overwrite
                           # 冻结 ego 线现状」冻结的就是 250，2026-10-07 软覆盖 arena
                           # 线时被静默改回 180，本次裁决是**恢复**不是新定。
                           # 原裁决 2026-09-30（180→250）：DeFoP 链 8 核 RTF~0.5、
                           # 地速仅 ~0.8m/s，180s 窗内返航预算结构性不够（seed43：
                           # 五机首腿 t=81-90 全撞 45s 看门狗→LOCK 推到 173s→返航无预算）。
                           # 更早口径：2026-09-08 裁决 1500→180s（仿真压缩测试）；
                           # 真机按规则原文 25 分钟=1500s，部署前改回。
                           # 本次恢复的实测依据（ego 10-07 23:48 局 uuid 7b1156ce，
                           # cruise 2.5 + ha=strict + depth，180s 口径）：六机**全部**
                           # 进 RECON（`crossed zone, RECON scan begin` ×6），
                           # `COLOR_UNRESOLVED`=0（无一台走完重扫轮次=非逻辑死路），
                           # 0-5 号**无一**能在 45s 腿限内到达首个平台（`RECON leg
                           # timeout, skipping` ×6，首爆 t+67~80s），仅 4/5 号
                           # LOCK+MATCH ⇒ 终局 correct=2 landed=0 s2=0，是**预算被
                           # 砍断**。⚠口径警示：本仓一切以「180s 内吞吐量」标定的历史
                           # 读数（含 DeFoP p3b 78.9 判线）在 250s 下**不可直接对线**，
                           # 须重定标或明示窗口。
phase_timeout_s: 60        # P3 起飞阶段超时（含错峰延迟）
takeoff_stagger_s: 3.0     # 多机错峰起飞间隔(s)：drone i 延迟 i*stagger
entry_stagger_s: 2.5       # P4 进入林区错峰间隔(s)：drone i 延迟 i*stagger（避免六机同挤入口）
return_stagger_s: 3.0      # 返航错峰间隔(s)：drone i 投放后延迟 i*stagger 再返航（避免六机同挤返航走廊互撞）

# ---- 飞行高度约定 ----------------------------------------------------------
heights:
  takeoff_hover_z: 1.5     # 起降区悬停
  cruise_z: 2.25           # 【2026-10-08 用户裁决】林带巡航 2.5→2.25m。**固定高度，
                           # 不做动态**（曾议「2.0–2.5 动态巡航」，本裁决取定点）。
                           # 沿革：1.2（≤10-06）→ 2.5（10-07 裁决）→ 2.25（本日）。
                           # 关键别名（`mission_executor._goto` 的 z 实参，16 处调用点
                           # 全部读本键 ⇒ 改这一个数即可，见 mission_executor:188）。
                           # 机顶 = 2.25+0.35 = 2.60；机底 = 1.90。
                           # ⚠ 改回/再抬前必读的五条边界（数值均 2026-10-08 实测）：
                           #   ①冠包络底 min 2.809（中位 3.89，203 棵）⇒ 2.25 净空
                           #     **+0.209m**。2.5 时机顶 2.85 侵入 0.04m——本日降高的
                           #     直接收益，该侵入解除。（冠对硬碰撞惰性，但
                           #     render_crowns 一旦从 false 翻回 true，冠点即进
                           #     /cloud 占用与反应层。）
                           #   ②围栏顶 **2.80**（scene_topology:76/79/82/85；⚠
                           #     sim_settings:723 的「西围栏顶 1.30」是**过期注释**）
                           #     ⇒ 2.25 净空 +0.20m；2.5 时机顶 2.85 超 0.05m。
                           #   ③网顶 2.50 仍落在机身带 [1.90,2.60] 内 ⇒ 网仍是活障碍，
                           #     2.25 **不**越网（与 2.5、1.2 同）。真越网须机底>2.50
                           #     即 cruise>2.85。
                           #   ④map_z_band 上界 2.60（不得上调，距冠底仅 0.209）：
                           #     机位距带顶 0.35（2.5 时仅 0.10）⇒ 其上方观测点被
                           #     证据窗丢弃的量减小。带是**证据窗非行为限制**，行为
                           #     封顶仍是 flight_z_ceiling 4.5。
                           #   ⑤反应层门 |z-pz|≤dr+ca_height_extra=0.65 ⇒ 本档
                           #     [1.60,2.90]（2.5 档 [1.85,3.15]）。对真枝带
                           #     0.8–2.6 的重叠由 0.75m 增至 **1.00m** ⇒ 枝探测面
                           #     变宽（sim_settings:540/593 记录的「巡航 2.5 常被
                           #     gate 滤掉」随之缓解）。
                           #   ⚠ 未解除的一条：2.25 仍 ≥ 2.16 ⇒ 冠球 2.809 仍在反应
                           #     窗内（判据见 sim_settings:794）。要脱开须 cruise ≤ 2.16。
                           #   ⚠ 垂直行程账：每段垂直位移随巡航高度同步 −0.25m（升段
                           #     与降段各一次），对 time_limit_s 250 是轻微顺差；量级
                           #     小，不单独计账，并入本局 A/B。
  climbout_z: 0            # 【L3 爬出点垂直分层 2026-10-11 判毙回滚，键保留门控】
                           # 0/缺省=回退 cruise_z 旧行为（代码 :211/:704 常在）。
                           # 案卷：三路前置确认（wf_11601bcd）判 SAFE_AT_345/
                           # 实施面 1 行；A/B 两局即触杀线——**l3_1/l3_2 各两机
                           # 巡航腿中段冻结**（z=2.25、clear 2.3-4.2 无障碍、
                           # plan 健康 gpath 74-98、看门狗零升级、每局两机同拍
                           # 冻结；d3 冻在 GOTO_HI 腿烧满塌缩 135s 帽→DROP=None
                           # s1=50，d0 冻在 RETURN 腿），landed 双局 4/6（85/75
                           # 分）。归因干净：L18g+L18 七局 30 机·局零 STALL vs
                           # L3 2/2 局（唯一变量 climbout_z 0→3.45）。**机制未
                           # 定谳**（POST-HIT 排除、sep 邻居排除、位置散布 x
                           # 8.7/19.5/26 非热点；疑爬升-下降瞬态与既有 STALL
                           # 活锁族的Timing交互）。原判据（等待摩擦）本就温和
                           # （等待池 med 45s/局、L18g 带底 30s），不值得续赌。
                           # 几何事实仍有效：爬出柱距最近树干 8.5m 零冠重叠、
                           # belt_x_max=20 承重墙、冠窗 WATCH（过 x=20 林缘
                           # z>2.46 穿物理在/软件盲冠层）。翻回=改本键。
  identify_z: 1.2          # （fallback 模式）投放点正上方识别高度
  flight_z_ceiling: 4.5    # 【行为封顶 2026-09-23 用户裁决】nav _on_goal 对 goal z
                           # 钳位（0=不钳）。旧"巡航带 [0.70,2.60] 封顶"实为证据窗
                           # （sim_settings map_z_band，挡冠点反幻影墙）非行为限制；
                           # 本参数把封顶落成真实机制，距 OVER_HEIGHT max_height_m
                           # 5.0 保 0.5m 余量（贴线+2s grace 即退赛，W5 楔死教训）
  drop_hover_z: 0.80       # 投送平台悬停投放高度（用户裁决 2026-09-09：0.55→0.80，
                           # 末段 P 环过冲 ~0.2m 时停 0.6 仍高于触地面 0.35；
                           # 注意规则原文口径 50~60cm，真机按规则 0.55 复核）
  drop_hover_tol: 0.62     # 精投放到位阈值(m)：RECON 降平台上空/扫描起始。
                           # 须覆盖 悬停真值 ~0.3（nav 到位停拉阈 0.4 内的稳态）
                           # + 定位漂移上限 0.3——漂移是慢随机游走，机载估计
                           # 位置 0.27-0.57 随机，门太小则进 SCAN 全凭漂移相位
                           # （run12 法证：d0 估 0.57 卡死 45s 腿超时，d3 估
                           # 0.23 幸进）。判分走 scorekeeper 真值快照不受漂移
                           # 污染（真值 offset 稳定 0.2-0.3 << 判线 0.6），放宽
                           # 机载门不影响正确分
  drop_release_tol: 0.35   # 释放对准门阈值(m)：MATCH 后须收敛回平台心才放行。
                           # 配合 executor 对准期步进精修（P0-1：0.45 过冲 goal
                           # 重启 nav 拉，单步收敛 ~0.1）——run13 被动 hold 空
                           # 等超时硬放 offset 快照 0.26-0.58 骑判线 0.6。
                           # 真值 offset 下界=|漂移|（对准地图坐标固有极限）
  drop_align_timeout_s: 6.0  # 对准兜底放行(s)：分离力持续时防死等
  drop_mid_z: 1.00          # GOTO_LO 中继高度(m)：三段各 ~0.2m 温和递降消 P 环过冲；<=0 退回两段
  drop_arrival_tol: 0.8    # 投送平台水平到位阈值(m)（fallback/粗到位沿用）
  area_arrival_tol: 2.0    # 区域到位阈值(m)

# ---- 颜色识别闭环（规则口径：平台色-类型对应赛前不告知） -----------------------
# enabled=false 时逐位回退旧行为（任务直配投放点 + /detected/type 类型匹配）
color_id:
  enabled: true
  source: camera          # 【诚实化 2026-09-23 翻默认】camera=下视相机 HSV 识别
                          # （camera_sim_node 渲染 + color_detector，真机 D435
                          # 同代码，c016b0e E2E 已过）；truth=真值几何门控
                          # （god 对照臂，A/B 用）。作弊审查定谳：truth=识别
                          # 理想化（机群无需看见平台即知颜色）。source=camera
                          # 时真值 tag_detector 自门控让位，结构互斥。
  scan_dwell_s: 2.0        # 每平台悬停侦察最短停留(s)
  min_conf: 0.8            # 识别置信度门槛
  n_frames: 3              # 连续命中帧数（bucket_select）
  max_scan_rounds: 2       # 全扫无果的重扫轮数上限（超出即 COLOR_UNRESOLVED）
  scan_leg_timeout_s: 45   # 单条 GOTO 腿超时(s)，超时跳平台（plan_fail 类活锁兜底）
  # ---- RECON 提速 L18 三开翻默认（2026-10-11 三臂终判，17 局收官）----
  # L18（三开）5/5 过闸：零 leg_timeout/零重扫/30/30 全 r0 锁定，DONE med −13%、
  # 落单机 max −21%、方差 38s vs 70s——唯一无判毙臂。判毙记录：L19a（豁免+环序，
  # run1 烧穿 75 分）、L19b（L1 裸环序，排除塌缩+45s 帽=单目标烧穿+d4 同格撞两连）。
  exclusion_memory: true   # L1：dwell 零命中+末拍高置信异色→本局排除不重访（杀重访链）
  nearest_first: true      # L8：起扫环序按距离升序——短腿保 45s 帽永不触发=烧穿免疫
  first_leg_exempt: true   # 首腿豁免：仅 L8 存在时安全（L19a 反证），L18 形态下生效
  exclude_min_conf: 0.9    # L1 采集置信门（T 臂实测异色确认 conf 0.93-0.94）
  # ---- L26 判毙存档（2026-10-11 run1：landed 4/6 d3 塌缩烧穿；L2 时机错位
  #      0 触发——认领在到位沿之后才出现，白降已被 low_occupant+SCAN-LOCK 双闸拦）
  recon_holder_precheck: false # L2：判毙（检查时机错位，无增量价值）
  claim_ttl_s: 0               # L6：未获检验（本局零僵尸）；合法认领最长 52s，代码保留门控
  # ---- RECON 提速 R2 臂（2026-10-12 立案，同日 5 局 A/B 收官翻默认）----------
  # claim_color_gate：异色认领跳台。机队色表=各机实际箱色广播（executor
  # _on_mission 直发 /drone_<id>/mission/box_color，latched；sim 单 master 下
  # 广播值=分配律值逐位等价，A/B 结论平移不受影响。真机人工指派可偏离 i%n
  # 律——静态律推导已从 _foreign_claim 删除，广播=唯一权威），认领=他机
  # 机载识别广播——不消费 dp.color（sim 特权）。
  # A/B 定谳（B 臂 5 局 vs A 池 6 局默认档）：DONE med 237→197.3s（−16.7%，
  # 线 −10%；5 局全部单局 ≤207.4）；5×满分/landed 6/6/RTF≥0.975/STALL 0/
  # Σcol 2/0/0/0/1；机制对质 12 跳台 12/12 全异色零误杀，t_recon d0 −38%/
  # d3 −22%/d5 −25%（d4 蓝对照连带 −30%，d1/d2 +8s 噪声级）。
  claim_color_gate: true
  settle_gate: true        # SCAN 入场稳定门（P0-1 第二刀）：est xy 在窗内极差
                           # <settle_tol_m 才开扫——强迫 MATCH/释放发生在 nav
                           # 收敛圈（真值 ≤0.15）内而非摆动弧上（run15' 法证：
                           # 边飞边转下降穿过位置门，release x 偏东过冲 0.62）
  settle_window_s: 0.8     # 稳定判窗(s)：漂移是慢游走窗内位移≈0，飞行/推挤大
  settle_tol_m: 0.10       # 窗内 xy 极差阈值(m)，≈0.12m/s 判稳线
  arrive_gate: true        # 到位信号门（P0-1 第三刀）：SCAN 入场/释放改挂 nav
                           # 伺服收敛信号 /nav/arrived（est 系 xy 圈 arrive_tol_est
                           # + z 真值圈，与水平控制律同帧）。run16 教训：settle 窗
                           # 会把 P 环尾段慢速爬行误判为稳定；run17 教训：信号
                           # 不能用真值帧（水平律驱动 est 系，伺服锁点真值=
                           # goal−drift，|drift|>0.15 时真值判据永假→五机 SCAN
                           # 全超时）。伺服锁点释放 offset=|漂移|=理论下界。
                           # 旗关=回退 est 释放门+settle 窗
  camera_detector:         # 相机检测算法参数（source=camera 时被 color_detector 消费；
                           # 真机 D435 覆写 image_topic 并按光照重标 hsv）
    image_topic: camera/image_raw   # 相对机 namespace；真机=/camera/color/image_raw
    stale_s: 0.4            # 图像龄超此值判相机断链，看门狗发哨兵（NO_DET 复位）
    min_blob_area_px: 40    # 色块噪声地板(px)：低于此判无检测
    hsv:                    # OpenCV H 0-179 / S,V 0-255；初值由 PLATFORM_COLORS
                            # 推导（红≈0、蓝≈109、黄≈28），camera_selftest B/D
                            # 定稿；真机按光照重标
      red_lo1: 0
      red_hi1: 8
      red_lo2: 172
      red_hi2: 179
      blue_lo: 100
      blue_hi: 115
      yellow_lo: 20
      yellow_hi: 35
      s_min: 120
      v_min: 80
    conf:                   # conf=w_circ*圆形度+w_pur*色纯度（+w_area*面积分，
                            # 默认 0）。形状/纯度对距离与水平偏移不敏感——真机
                            # 盘溢帧也成立；面积只作噪声地板
      w_circularity: 0.6
      w_purity: 0.4
      w_area: 0.0
      area_floor_px: 40

# ---- 运动限制 ---------------------------------------------------------------
motion:
  default_max_vel: 2.0
  default_max_acc: 4.0
  cruise_above_canopy: true   # 若 false 则切"穿隙"模式（需配 forest.trunk_spacing）

# ---- 类型匹配安全策略（重写旧平台思路） -------------------------------------
type_match:
  min_confidence: 0.8      # P1 置信度门槛
  consecutive_frames: 3    # P2 连续帧确认
  hover_timeout_s: 12.0    # P3 悬停超时
  unknown_tag_policy: ignore   # P4 未知 tag：ignore | abort
  position_gate: true      # P5 位置门限（必须在投放点 tol 内才匹配）

# ---- 投放点 Tag 检测参数 ------------------------------------------------------
tag_detection:
  tag_range: 4.0
  fov_deg: 60.0
  occlusion: true          # 立木遮挡参与判定

# ---- 计分规则 ---------------------------------------------------------------
# ---- 计分（科目三比赛口径：S = S1 + S2，满分 100）----
score:
  s1_per_correct: 10      # S1 投放分：每箱正确投放到对应颜色平台 +10
  s1_cap: 60              # 队级 S1 封顶（6 箱 x 10）
  s2_ladder:              # S2 完成分：时限内返回起降区降落机数阶梯
    6: 40
    5: 30
    4: 25
    3: 15
    2: 10
    1: 5
    0: 0
  drop_tol_m: 0.6         # 平台投影判平台半径（平台直径 1.2m）
  wrong_drop_penalty: 0   # 错投/偏投 0 分不倒扣
tiebreak: [total_score, completion_time, first_correct_drop_time]

# ---- 合规监视（rule_monitor，P5：退赛条款） ----------------------------------
rule:
  enabled: true
  # 【2026-10-11 订正】旧值 ±30.35（内缘 30.0 外扩 0.35）落在墙体 [30.0,30.3]
  # 外 0.05m ⇒ _assert_fences 三面必假（三局每局 3 条 ERROR）且 OOB 线悬在墙外。
  # 收到墙外缘 ±30.3：出界=越过墙体=真出物理场地；真场档不随改（网是零厚度
  # 平面，0.35 外扩语义自洽）。起降区在围栏内西清理带（pads x=-27.75~-24.75）
  geofence: [[-30.3, -30.3], [30.3, -30.3], [30.3, 30.3], [-30.3, 30.3]]
  out_of_bounds_grace_s: 10.0
  ground_contact_z: 0.30
  unauthorized_landing_grace_s: 1.5
  max_height_m: 5.0
  height_grace_s: 2.0
  return_through_forest: true
  corridor_margin_m: 1.0     # 树林外接框外扩(+)容忍贴林缘 / 内缩(-)严格
  return_corridor: []        # 显式多边形优先；空=按树林外接框推导
  retire_on_corridor_miss: false   # 默认只剥 S2 计数不退赛
  retire_score_keep: true    # 退赛机 S1 保留、S2 剔除
  selftest_inject: false     # 注入后门（P8 注入测试临时开）
