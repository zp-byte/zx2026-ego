# =============================================================================
# sim_settings.yaml — 仿真运行设置
# 切换物理后端 / 保真度 / 时间管理 / 随机种子
# =============================================================================

run_seed: 43                # 一切随机种子（同 seed 可复现）

# ---- 物理后端 ----------------------------------------------------------------
backend: cascade_pid       # kinematic | cascade_pid | gazebo
kinematic:
  yaw_rate_max: 1.5
cascade_pid:
  pos_kp: [1.2, 1.2, 1.5]
  vel_kp: [2.0, 2.0, 2.5]
  vel_kd: [0.6, 0.6, 0.4]
  max_tilt_deg: 30.0
  max_vel: 2.5
gazebo:
  # 预留：外部 gzserver 连接参数（S7 可选后端，本文件仅占位）
  host: 127.0.0.1
  port: 11345

# ---- 导航规划 ----------------------------------------------------------------
nav:
  resolution: 0.5          # A* 栅格分辨率 (m)
  inflation: 0.4           # 额外安全边距 (m)；实际膨胀 = drone_radius + inflation。
                           # 【0.4 定论】栅格 ceil 粒度无中间档（0.55 与 0.4 同为
                           # 2 格膨胀）；0.9=多 1 格 → A* 绕行变长（m09_43 直线度
                           # 0.31 vs 典型 0.45），3/3 满窗超时 FAIL——零碰撞零 de
                           # 零 stall，到期仅投 4-6/6，纯慢不是封死
                           # （run_logs/batch1_20260901_145602）。重评条件：连续
                           # 距离场膨胀（半格精度）或赛制窗口加长。
  separation_radius: 1.5   # 多机防撞：进入该半径(m)即叠加分离速度
  separation_gain: 3.5     # 分离速度增益
  metrics:
    enabled: true          # P0 指标埋点（纯观测，不改行为）：/drone_<i>/nav_metrics
                           # 收集器 nav_metrics_node 落盘 run_logs/（时序 CSV + 汇总 YAML）

# ---- Boids 群集（真正的集群算法：分离已有，对齐+聚合新增） ------------------
# 经典 Reynolds flocking：聚合（趋向邻居中心）+ 对齐（匹配邻居速度），配合 nav
# 的 separation（分离），编队从局部交互涌现（无领航、无中心）。
# 注意：与 formation.yaml（静态编队协调层）互斥，二者同时开启会打架。
swarm:
  enabled: true             # true=启用群集
  alignment_gain: 0.4       # 对齐权重：匹配邻居平均速度
  cohesion_gain: 0.2        # 聚合权重：趋向邻居平均位置
  perception_radius: 8.0    # 邻居感知半径 (m)，对齐/聚合用（覆盖全组）
  z_band: 0.5               # 邻居高度差阈值 (m)：只与同高度带邻居交互，避免
                            # 爬升/下降中的无人机被水平拉向巡航邻居
  min_z: 2.0                # 低于该高度不启用（避免起降/投放干扰）
  obstacle_scale: true      # 近障碍(<2m)时缩放群集力，防被拉进树
  # ---- W1 swarm 层治理（2026-09-03 贴树判官团定稿，matrix_w1b 翻默认） ----------
  obs_guard:                # 聚合/对齐增量过 sep_obs_guard 同款障碍投影（保切向）。
    enabled: true           # 【默认开，matrix_w1b 20260903 12/12 后翻】代码事实：
                            # _apply_separation 的 pre-guard 只管分离增量，
                            # _apply_swarm 的 coh/ali 直加无任何障碍管辖
                            # （obstacle_scale 只缩模不改向）——734 碰撞聚类主因的聚合
                            # 半边（Gazebo 实弹"挤入零 guard 行"头号根因）。A/B 证据：
                            # D_full(三旗合开) 3/3 col=0 minclr 0.521（A 基线 0.399），
                            # swarm_guard hit 仅 D 臂在场；B 单开 col 反升证明不可拆。
  rescue_quiet:             # 救援态（de 逃逸/gs 盲推/规划失败期）静默 coh/ali 两个聚
    enabled: true           # 合项，退出后 ramp_s 线性爬坡重入。【默认开，matrix_w1b
    ramp_s: 2.5             # 后翻】聚合推 0.4-0.8 m/s ≈ 逃逸基速 0.6 同量级，会改写
                            # 逃逸矢量（链内二次蹭 ×2 / 0.65s 即刻再暴露 / 跟车级联
                            # 的公共力源）；分离与硬推层在下游照常，机间安全底线不动。
                            # ramp_s=2.5 与 exit_hyst_s 同值同源（重入不早于救援确认）。
                            # A/B 证据：quiet-window 数 ≈ de_engaged（C43 14:14），
                            # C/D 对 B 收碰撞，单独 B 臂 col 2.0 不收。

# ---- 任务层（W1 贴树判官团） --------------------------------------------------
mission:
  via_slots:                # 越界点散点槽位：共享越界点=穿越区重心 (1.0,2.0) 几乎压在
    enabled: true           # tree#24 (1.1,2.0) 树干上——六机漏斗串行 + goal 格恒占用
                            # 【默认开，matrix_w1b 20260903 后翻：zone_margin 修复
                            # 绊线误杀后 12/12 全 PASS，D 臂 VIA-SLOT 18 行/回退 0】
    source: cloud           # 【诚实化 2026-09-23 翻默认】cloud=槽位净空查本机点云
                            # 占用格（executor 订 /drone_<id>/cloud，map_z_band
                            # 内观测点 0.5m 栅格化；未观测区域放行=几何散点，
                            # 反漏斗意图由 y 带结构保持，飞行中 A*/反应层兜底）；
                            # truth=Scene 真值净空验证（god 对照臂）。
                            # 作弊审查定谳：真值模式=机群读到了没飞到的林子。
    slot_clear: 1.5         # → A* 5×5 幻影豁免长期在线 + GOAL-SEAL 盲推。散点把汇聚
    slot_sep: 2.5           # 点换成 6 个真值净空验证过的点（吸引子层唯一修复，判官团
                            # Tier-1 首位）。y 向散开=zone 均分 6 条横带每带一槽
                            # （逐对 y_spread 装箱在 8m 走廊是刀锋 packing，selftest
                            # 实测不可行，故弃用带分）。slot_clear 是安全地板永不
                            # 降级；选不满自动回退共享点原行为。
    assign: drop_y          # assign=drop_y：drop_y 名次↔槽位 y 升序对号（各机本地
                            # 同参计算，无需跨机通信）。
    zone_margin: 1.0        # 槽心距带缘最小深度（matrix_w1 教训）：executor 的
                            # CROSS_ZONE 腿有"到点未过带即 FAILED"绊线（drop_tol
                            # 0.8m 球须全含带内）——贴缘槽（北缘内 0.5m）球戳出带外，
                            # 护栏壳骑行的机带外进槽即误杀（drone5 整机 0 分，D 臂
                            # 3/3 复现）。zone_margin=1.0>0.8 恢复"到槽⇒过带"不变量。
  return_route:             # W2-P1 返航路由（docs/wave2_corridor_case.md）：
    enabled: false          # 【2026-09-18 v1 判毙，w2_matrix 4臂×3seed】东喉口
                            # 漏斗化：tree#34(13.0,6.8)×tree#41(12.7,10.0) 咽喉
                            # 聚 8 起（C 9 col vs A 9 持平但集中）、s43 landed 5/6
                            # -10 分、d4 外圈逃逸 (12.6,11.3) via 未拦住——"改道=
                            # 风险再分布"第四次复刻（hotspot/E/I 同判词）。默认关
                            # 保持。v2 方向（未执行）：喉口错峰/单机化须先解
                            # tree#34/#41 拥堵，且 P3 毙词（个体贴树非争缝）不适用
                            # ——喉口是真争缝形态，重评须带此区分。
    via_y: 8.5              # 中缝唯一全宽自由带 y 8.10..8.90 带中心（离线核查
                            # w2_return_route_check.py：9.5/9.0 擦树 FAIL）
    jitter: 0.1             # 逐机 y 抖动（id%3）

# ---- 闭环感知规划（去掉"上帝视角"） ------------------------------------------
# enabled=true ：nav 只消费 lidar 点云，累积成全局持久占用图（SLAM），在带定位
#                漂移的置信位姿上做全局 A*，不再读 scene 真值占用；lidar 模拟
#                Mid-360 式顶盲锥。
# enabled=false：回退真值全局 A*（原版 god-mode）。
closed_loop:
  # ---- 贴地 vz 地板二次兜底（2026-09-30；false=逐字节旧行为）--------
  # 地板只在反应层**之前**施加（nav_node.py:1402），而分离场/云避障之后
  # 仍 cmd[2]-=push*uz——投放下降段被自己的避障往下压穿地板（探针实测
  # 36 次/跑），偶跌破 contact_z 0.30 即 UNAUTHORIZED_LANDING 退赛。
  # true=发布前再 clamp 一次（保留 landing_armed 豁免）。预设切换：
  # tools/defop_zfloor_preset.py
  z_floor_post: false
  enabled: true            # true=点云闭环全局规划；false=真值全局 A*（原版）
  halt_on_landed: true     # 【run9 翻开】着陆终态机退出控制/分离场：pads 同排 1.5m <
                           # 分离半径，已落地机留在 Boids 分离场——后降机被托在
                           # z≈0.35-0.41 永不达 touchdown 判据（run8 d1 armed×3
                           # 卡 70s+）、先降机被托离地面（d0 0.05→0.78）。
                           # LANDED/DONE 剔除；RETIRED/FAILED/ABORT 悬停锁定保留
  drift_rate: 0.006        # 定位漂移随机游走速率 (m/step @ replan_hz)，慢累积≈150s 到 ~0.2m
  drift_max: 0.3           # 漂移上限 (m)
  lidar_top_blind: true    # 顶盲锥（Mid-360 式，正上方盲区）
  replan_hz: 10            # 漂移更新 / 控制频率 (Hz)
  max_vel: 1.8             # 闭环巡航限速 (m/s)（用户裁决 2026-09-09：1.5→1.8，
                           # 180s 时限提速项 B；仍低于全局 default_max_vel 2.0）
  arrive_tol: 0.4          # 到位停拉圈 (m)——巡航/中转 goal 的到位判据
  arrive_tol_low_z: 0.15   # 低空精确段停拉圈 (m)（P0-1：goal z<low_z_max 时生效，
                           # drop 悬停 0.8/touchdown 0.12；0.4 圈随机停点+漂移
                           # =释放 offset 0.26-0.58 骑线真身，run13/14 法证）
  arrive_tol_low_z_max: 1.5  # 低空特化的 goal z 上限 (m)
  arrive_tol_est: 0.10     # 伺服收敛信号圈 (m，est 系 xy)——/nav/arrived 广播判据。
                           # 水平控制律驱动 est 系（cmd=航点−est_pos），平衡点
                           # est=goal、真值停 goal−drift（run17 法证：真值判据在
                           # |drift|>0.15 时永假致五机 SCAN 全超时）；信号须与
                           # 控制环同帧，此刻 cmd≈0 零爬行，释放点=理论下界
  # ---- P1 时间一致性（DeFoP §anti-oscillation 移植） --------------------------------
  # (a) 路径粘滞：全局 A* 路径设最短驻留 stick_s，期间不重选，除非 路径被新占用格
  #     切断 / 碰撞事件 / 新 goal——治"绕树左右两解等代价时每 0.5s 重选来回翻"。
  # (b) 方向翻转锁定：滑窗监测水平指令相对 goal 连线的侧向符号翻转率，超阈值且
  #     近障碍时锁定当前侧、加小偏置，clearance 解锁或超时——治反应层合力抖动。
  # enabled=false 时逐位保持原行为（每 0.5s 无条件重建+重选）。
  temporal_consistency:
    enabled: false         # 【默认关】2026-08-30 4臂×seed矩阵定论（run_logs/matrix_20260830_163547）：
                           # 无风 B 臂略劣于 A 基线（PASS 均分 154.0 vs 156.25，DONE +23s，碰撞 3.75 vs 1.75）→ 不翻默认；
                           # 风场 D 臂显著占优（碰撞 8.0 vs 13.5，stuck 85 vs 172s，DONE -47s，+6 分）
                           # → 开 wind 压测时建议同步开 tc。待 P1.1 进展门控重选后重评
    stick_s: 1.5           # 路径最短驻留 (s)
    flip_window_s: 2.0     # 翻转率监测窗口 (s)（翻转计数本身无论开关都采样，供 P0 指标）
    flip_rate_max: 0.6     # 翻转率阈值 (次/s)，超过且近障碍才锁定
    bias_gain: 0.35        # 锁定期侧向偏置幅值 (m/s)
    unlock_clearance: 1.5  # 解锁所需最小 clearance (m)
    max_lock_s: 6.0        # 单次锁定最长时长 (s)，防永久锁

  # ---- 漂移感知裕度（2026-08-31 碰撞法证产物） ----------------------------------
  # 点云是真值系（lidar 真值位姿 raycast）、clearance 测量无偏；但控制几何在
  # est 系（est=truth+drift）。漂移背向最近障碍（drift·u<0）时 est 距离比真值
  # 大 |drift·u|——控制器高估裕度，真值裕度被侵蚀，与 vcap 的 0.35 速度地板
  # 叠加 → 低速贴树挤入（live 158 分 run 三次碰撞接触时速度 0.12-0.98 m/s，
  # 全为慢挤入形态，无高速撞击）。机制：vcap 改用有效裕度
  # eff = clearance − max(0, −drift·u)，且 0.35 地板随侵蚀占比线性衰减到 0
  # （连续不冻结，避开 P2 scale→0 磨树病灶）。enabled=false 逐位原行为。
  drift_aware_margin:
    enabled: false          # 【默认关】2026-08-31 同码 A/B（run_logs/dam_20260831_181122，
                            # seed 42/43/45 双臂）：col 4.0→2.67、minclr 0.266→0.291
                            # 有改善，但 P42 stuck 42→238s（+195s，终态速度 0.07-0.11
                            # m/s 冰川爬行）、P45 满窗口 FAIL（456s 耗尽时 5 机仍在
                            # 投放松放，sleep=0 排除断档；O45 同 seed 155s PASS）。
                            # 根因：漂移是持续向量（随机游走饱和 0.3 后不归零），任务
                            # 走廊与漂移大面积背对时整条腿 vcap 地板衰减到 0——机制
                            # 从"贴脸保护"退化为任务级减速，seed 间差异即漂移方向
                            # 随 seed 变化。重评条件：真机移植（真实定位误差非持续
                            # 向量）。
                            # 【v2 亦否决 2026-09-02】A/B（run_logs/dam2_20260902_165420，
                            # seed 42/43/45 双臂全 PASS）：门控生效——无 P45-style
                            # 满窗 FAIL、P42 stuck 28.6s 正常，任务级减速确认修掉；
                            # 但 col 反向恶化 3.67→6.00（三对 seed 全部 P>O 一致
                            # 方向）、done +36s。机理教训：挤入形态下"贴脸带减速"
                            # =延长暴露时间=接触机会增多；v1 全域减速反而因减少
                            # 暴露而少碰。速度地板是暴露时长调节器，不是安全项。
                            # dam 路线（v1/v2）就此判死；重评条件仅剩真机移植。
    deep_r: 0.7             # 深近区半径 (m)：eff 低于该值地板才开始衰减。0.7 恰
                            # 为基线地板 bind 边界（max(0.35, clr/2) 中 clr<0.7），
                            # dam 只接管基线本来就要兜底的带，干预面最小

  # ---- 近停区（碰撞法证另一半机制：vcap 地板贴脸不封零） ------------------------------
  # 2026-08-31 live 158 分 run 三次碰撞全为低速贴树挤入（接触时 0.12-0.98 m/s）：
  # vcap 地板 0.35 意味着贴脸仍保底 0.53m/s，goal/云推力把平衡点压进真值接触。
  # near_stop_zone：距 goal<zone_r 时该地板线性衰减，deadband 处归零——目标点
  # 附近允许真正刹停。仅作用非 dam 分支；de 逃逸期间不衰减（地板是安全项）。
  # 【默认关】2026-09-01 同码 A/B（run_logs/batch1_20260901_145602，seed 42/43/45
  # 双臂，同矩阵另测膨胀臂）：全指标在跑次方差内——score 153.7 vs 154.7、
  # col 3.67 vs 2.67、stuck 52.1 vs 71.7s、minclr 0.290 vs 0.296、双臂 6/6
  # PASS。无独立收益：现行碰撞群集在走廊而非 goal 邻域，机制无标可打；
  # 保留实现，待"goal 邻域挤入"新形态出现时重评。
  near_stop_zone:
    enabled: false           # 【2026-09-08 重评翻开】平台上空精降新形态：hover 0.55 末段
                             # 被 vcap 地板保底 ~0.53m/s 压出 ~0.21m 沉深（速度环
                             # τ≈0.4s）→ z≈0.34 触地弹跳→退休级联（run6 六起碰撞
                             # 全 z=0.35 整）。2026-09-01 判词"待 goal 邻域挤入
                             # 新形态重评"即此形态；旧 A/B（batch1_*）当时碰撞群集
                             # 在走廊非 goal 邻域，无标可打=无独立收益，非否决。
    zone_r: 1.0             # 近停区半径 (m)，距 goal 小于该值地板开始衰减
    deadband: 0.2           # 距 goal 该值内地板恒 0（允许微调刹停）
    scale_min: 0.25         # 衰减钳位下限——归 0 会把 vcap 压到 0 冻结末段收敛
                             # （run7 d1 卡 touchdown 阈上方 / d5 腿超时法证）

  # ---- W3 塌缩卫兵（返航冻结修复，2026-09-05） --------------------------------
  # 形态：返航腿起飞数米后 mm/s 爬行至冻结（run 214546/194437/live 三局同
  # 形态，d5 三局全中、d2/d4 各 2，d0/d1 全净；冻结对间距 7.4-7.5m 恰在 8m
  # 集群感知圈内互为唯一邻居）。STALL diag 规划健康（gpath len83-97、
  # plan_fail=0、clear 1.1-3.7）而 vel_cmd 水平分量 ≈1cm/s、方向逐局变号、
  # 抖动 ±0.0002——前瞻航点塌缩回自身的伺服自锁（签名同 P3b 注释
  # "lookahead 航点=自身 → 指令≈0"，P3b GOAL-SEAL 只治了 goal 封锁形态）。
  # 卫兵在基指令层接管：沿路径向前找 ≥min_target 航点，全路径在身边则直指
  # goal；群集/分离/云避障/vcap 照常叠加，规划失败/近障/近 goal 不接管
  # （各自的地盘不越界）。触发日志 COLLAPSE-GUARD 同时是法证采样
  # （base/best/len/pick 落实塌缩机制本身）。
  # 【2026-09-05 翻默认 true】7-cell 同 seed(42) A/B（run_logs/cg_20260905_*）：
  # B 臂(关) 2/2 PASS(149/153)；A 臂(开) A1 157/A2 155 PASS，实弹 6 起 CG 触发
