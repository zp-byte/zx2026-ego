                            # done -40s；S43 持平（col 3=3，done +10s 在方差内）；S45
                            # X 超窗 FAIL→S PASS。minclr 0.263→0.299、flips 345→317。
                            # 无任何 seed 劣化 → 单开翻默认。
  hotspot_inflate:
    enabled: false          # 【2026-09-03 否决】H 臂 col 11/11/6（vs X 3/3/-），
                            # H43 满窗 FAIL——热点 +1 格改道把车流挤进邻树/收窄走廊，
