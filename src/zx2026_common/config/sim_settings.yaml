  # ---- W2-P2 fence 边界余量（docs/wave2_corridor_case.md） --------------------
  # 反应层 _apply_scene_avoidance 原对 fence 一刀切跳过——西坪 pad 进场低空段
  # （fence 顶 1.3 vs 机身带下缘 1.45 仅 0.15 差）与围栏顶角擦碰无近距推离。
  # 注意 fence 是"必须低空/越顶穿越的边界"（yaml 注释自证：围栏外移否则投放
  # 点 A* 不可达）→ 禁止在 A* 占用里封格（pad 不可达复刻旧案），唯一正确
  # 杠杆=反应层纳入：z 带不重叠（巡航越顶）时通用检查自动豁免，仅在低空/
  # 顶缘擦碰几何时介入。marker 保持跳过（投放目标，须可进）。
  boundary_margin:
    enabled: true           # 【2026-09-18 翻默认，w2_matrix 4臂×3seed 定谳】B_p2
                            # col 0/4/0 vs A 0/5/4（逐 seed 不劣化）、score 3×100、
                            # done_t 160/190/155 无回归、零 FAIL/零 retired。z 带
                            # 门控保证巡航越顶自动豁免。注意：目标场景（西坪
                            # fence 4 起）本轮 12 cell 零复现，增益含环境方差成分，
                            # 翻判依据=机制正确性+无 seed 劣化（W1 obs_guard 同
                            # 判据）；gz 后端真物理下的 fence 事件预防留待验证。

  # ---- W6 VO-lite 机间速度预测避撞（2026-09-07 d2/d3 返程互撞立案，默认关） ------
  # 病灶（法证定谳，run 20260907_152048）：sim 127.04s d2/d3 返程穿越区东侧
  # (4.6,1.3)/(4.3,0.3) 机间互撞——est 距 1.04m 落在 sep_radius(1.5)/hard_r(1.8)
  # 双激活带内仍相触（真值阈 0.7m）；两机 marker 同帧双触发 + 碰撞中点 3m 内
  # 无树（Scene 实例化树位最近 2.44m/2.49m）→ 撞树排除、互撞定谳。代码级
  # 根因：机间力场纯位置驱动——硬推 v_app 是自机指令投影而非相对速度，全链
  # 无 TCPA/DCPA/预测项；邻居速度 20Hz 真值可得（neighbor_vel）但唯一消费者
  # 是对齐项；返程 executor 只发单 goal（W2-P1 返航路由 parked），汇聚收口
  # 每拍重新注入朝向对方的基指令+聚合推，位置斥力不记忆不预测 → 反应距离
  # 不足（收口 ~2-3 m/s 时 1.5m 半径 ≈ 0.5s 反应窗）。
  # 机制（外层提前化解，位置分离软/硬推原样保留为内层底线）：对每邻居以相对
  # 速度算 TCPA/DCPA，0<tcpa<t_pred 且 dcpa<safe_r 且水平距<engage_r 判冲突，
  # 沿相对速度垂直方向加切向偏转——侧向取推离 CPA 线的一侧；镜像几何两机
  # c·t̂ 天然同号 → 同侧取号 → 世界系反向偏转（各向己右，分离率 2×push）；
  # s1≈0（对头/纯追尾）固定 +t̂ 同样互补。push=gain·score 封顶 max_push，
  # score 随 dcpa 逼近与 tcpa 迫近双升。纯切向、零减速项——dam v2
  # "贴脸减速=延长暴露"教训不进本层。
  # 边界（沿用既有纪律）：增量过 sep_obs_guard 同款障碍投影（tag=vo，分离
  # 盲推挤树教训）；救援态静默+退出 ramp 重入与 coh/ali 同款（不改写逃逸
  # 矢量，硬推底线不动）；swarm z_band/min_z 门控（爬降/起降段不干预）；
  # 邻居 age>stale_s 剔除（comm 延迟按时间戳语义，防"最新帧"塌缩教训）。
  # 不替代 W2-P1 返航路由（L1 路径层另行立案），合开臂留待 P1 落地后。
  # 触发日志 vo_avoid:（d/dcpa/tcpa/push 落盘=法证采样，127s 事故同款口径）
  # + _vo_hits 纯观测计数。数学核心=nav_node 模块级纯函数 vo_deflect
  # （tools/vo_selftest.py 离线数值验证，无 ROS 依赖）。
  # 【默认关待 A/B】矩阵 X 基线 vs V 开旗 seeds 42/43/45/46/47（tools/
  # mvo_matrix_run.py）；翻线=机间碰撞不增 + min_drone_clear_m（W6 新增
  # P0 第 12 指标，补机间净空失明；飞行段口径：双机均 z≥swarm_min_z 才计，
  # 垫距 1.5m 锚定已排除——对抗审查立案）逐 seed 改善 + 无任务级退化
  # （done_t 超方差即杀，O42 慢绕教训；minclr 不降，改道挤邻树代理）。
  vo_avoid:
    enabled: false          # 【W6 默认关——A/B 过线后翻】
    engage_r: 3.5           # 冲突预判启用距离 (m)，水平距
    safe_r: 1.1             # DCPA 判冲突阈值 (m) = 2×机半径(0.7)+0.4
    t_pred: 3.0             # TCPA 预判时域 (s)
    gain: 1.2               # 偏转推力增益（×score）
    max_push: 1.0           # 单拍偏转增量上限 (m/s)
    stale_s: 0.5            # 邻居 odom 时效门 (s)，超龄不预判

  # ---- P3 死端基元逃逸（DeFoP motion primitives 移植，仅借死端脱困） ----------------
  # 矩阵实测 2/14 cell FAIL 同因：碰撞标记（自机 est 格）膨胀成壳封死自格 →
  # _plan_global None → 永久悬停。触发后做基元逃逸：n_dirs 个均匀方向在占用栅格
  # 上射线评分（允许穿过 ≤pierce 格标记壳、验证 free_need 连续自由采样），
  # 选 score=可达距离+goal_bias·cos(方向,goal) 的方向以慢速驶出；规划恢复立即
  # 退出。无可行方向（全部 reach=0）保持悬停重试——绝不盲冲占用格。
  # 反应避障/分离/限速全程有效；逃逸只在规划失败时激活，正常飞行零影响。
  # 【2026-08-30 翻默认 true】三层机制（起点侧基元逃逸 + 目标容忍孔径规划 + gs 有界兜底），
  # 验证：矩阵 2/14 FAIL（起点侧封锁死锁）+ P3 验证 2 FAIL（目标封锁停车）形态全部
  # 修复；de=on 累计 10 run（seed 42/44/45/46/47/48/49/50，含 tc=on）全 PASS
  # 151-157 分，与基线分差在跑次方差内。触发日志：DEAD-END / GOAL-SEAL（rosout）。
  # 【2026-08-30 P2 修复包随带更新】①规划失败不再清空 _gpath（末次有效路径保持，
  #   治"规划翻 flap→指令间歇归零"停滞；A43 基线 456s 超时 FAIL→PASS 156/165s），
  #   de 触发/退出判据随之从 "_gpath is None" 改为规划失败连续时长
  #   (_plan_fail_since)；②逃逸方向新增点云走廊前置检查（cloud_clear_r）。
  #   验证 run_logs/p2b_*：B 臂 5/5 PASS 磨树归零，A43r PASS。
  # 【2026-08-31 P5 退出迟滞】est 在膨胀标记/树格边缘时规划成败逐拍翻转
  #   （单次成功窗口 <2s），单次成功即退出 → 逃逸频繁进出、停在云推力平衡点
  #   原地 flap（B43r drone5 累计 stuck 772.9s 仍 DONE，de 两进两出 1.6s/0.5s）。
  #   改为规划【连续】稳定 exit_hyst_s 才退出，迟滞期间继续沿逃逸方向驶出，
  #   把自机推离标记边缘后规划自然持续稳定。代价：真正恢复后多飞 ≤2.5s 慢速
  #   逃逸方向（0.6m/s、方向经云走廊验证，安全侧）。
  #   验证（run_logs/p5_* p5b_* p5d_*，seed43 双臂同码 A/B + 回归 spot）：
  #   ① in-vivo ~30 次 episode 全部 ≥3.1s、engage/done 严格 1:1——<2s 碎
  #     flap 结构性消失（B43r 形态在 16 run 中未再现，累计 stuck 回落 ~33s/run）；
  #   ② P5 臂（hyst=2.5）seed43 ×8 = 6/8 PASS vs 旧行为臂（hyst=0）×4 = 4/4，
  #     FAIL 率差在小样本噪声内（Fisher p≈0.44）；col/run 两臂同为 2.75，
  #     PASS 均分 155.3 vs 154.0；两次 FAIL（B43p3/H0b）均为满窗口超时（全机
  #     仍在动、无 stall、de 早于窗口尾 4.5min 收敛，时间账排除迟滞致因：
  #     全场逃逸总耗时 ~30s << 缺口 >250s）；
  #   ③ 干净 seed（B42p 157/155s）与风场（D43p 148/335s）回归无劣化。
  #   【默认 2.5 保留】。后续 CSV 法证（2026-08-31，nav_metrics_ts.csv 墙钟
  #   分桶）推翻"返航段慢速绕行"假说：B43p3 运行中段有 540s 墙钟断档（机器
  #   睡眠——进程冻结而墙钟窗口照烧，唤醒后即刻判死），FAIL 前 ~120s 飞行
  #   节奏正常；CSV 全库无一个"干净满窗口 FAIL"（干净 run 14/14 PASS，
  #   155-335s，每机里程 ~110m 与快 run 持平）。满窗口 FAIL = 睡眠污染，
  #   非策略缺陷；matrix_run 已加 wall-monotonic 漂移检测（>30s 判污染，
  #   现场留档 __contaminated 并自动重跑）。
  deadend_escape:
    enabled: true
    confirm_s: 0.5          # 规划连续失败该时长才触发（防瞬态 None 误触发）
    dwell_s: 1.2            # 单方向驻留 (s)，到期重评分（栅格/标记已更新）
    speed: 0.6              # 逃逸速度 (m/s)，慢速防二次碰撞
    ray_len: 3.0            # 方向评分射线长 (m)
    n_dirs: 16              # 候选方向数（均匀圆周）
    pierce_cells: 8         # 允许穿过的占用采样数（标记壳 ~2 格 ≈ 5-6 个采样）
    free_need: 3            # 验证所需的连续自由采样数（3×0.25m）
    goal_bias: 1.5          # goal 对齐权重（与可达距离同量纲）
    goal_stall_s: 3.0       # P3b 目标封锁直达触发：goal 格被占且停滞该时长 (s)
    goal_speed: 0.8         # P3b 直达逼近速度 (m/s)
    goal_max_s: 10.0        # P3b 单次直达周期上限 (s)，超时回正常规划（周期性试探）
    cloud_clear_r: 1.0      # P2 修复：逃逸方向沿线上该距离(m)内有点云障碍即淘汰
                            # （栅格壳可穿≠真树可穿；真树近旁的逃逸方向会被否决
                            # 层冻结成磨树级联——P2 矩阵 B 臂 highZ 磨树 40:0 教训）
    exit_hyst_s: 2.5        # P5 退出迟滞 (s)：规划连续稳定该时长才退出逃逸
                            # （治规划逐拍翻转 flap：单次成功即退出 → de 频繁进出、
                            # 云推力平衡点原地卡死；B43r 累计 stuck 772.9s 教训。
                            # 取值 > 实测单次成功窗口 ~1-2s；0=旧行为，A/B 见上）

  # ---- P4 滑窗点缓存（DeFoP M3 移植） ----------------------------------------------
  # 占用格时间戳化：重观测刷新，超 ttl_s 未重观测的格衰减（重建时惰性剪枝）。
  # 治"只加不删"的两个病灶：①噪声/漂移错位格永生，树周涂抹+膨胀加宽封锁带
  # （起点/目标自封的高发土壤）；②被重观测证伪的旧格不消失。无重观测区域
  # 保持记忆（远处真树仍被规划绕开，不是清空地图）。碰撞标记（事件真值）
  # 独立持久，不随窗衰减。enabled=false 逐位原行为（持久集合）。
  # 【默认关】2026-08-31 同码 A/B（run_logs/p4_* p4b_*，双臂×seed 43/45/42；
  # p4 首轮 O45/O42 跨机器休眠被 ROS 传输劣化污染，p4b 干净重跑）：
  # 双臂 3/3 PASS（O 均分 154.0 vs P 155.0；col 4.7:3.3、stuck 55.9:42.6s、
  # flips 309:282——P 臂各次要指标略优但均在跑次方差内）；机制指标 de 触发
  # 3.7:4.7 次/run（P 臂"地图遗忘→路径切→规划短失败"churn 使 de 略升）、
  # gs 0.67:0.67 无差异。150-200s 任务太短，TTL 45s 的收益（清陈旧格）与
  # 代价（遗忘 churn）近似相消 → 默认关，零风险口径与 P1/P2 一致。
  # 重评条件：任务时长显著变长（漂移涂抹变大）或出现"陈旧格封路"新形态。
  point_cache:
    enabled: false          # 【默认关】A/B 无净差异（见上）；长任务/强漂移场景可开
    ttl_s: 45.0             # 滑窗时长 (s)：超过该时长未重观测的 lidar 占用格衰减。
                            # 量级依据：drift 随机游走 ~0.06m/√s 误差达半格(res/2)
                            # 需 ~170s（任务时长内漂移涂抹有限），故 ttl 主要清
                            # 噪声幻影与重观测区错位旧格，取 45s 保远处记忆足够
                            # 覆盖一次穿越规划 horizon，又不至于把幻影留满全场

  # ---- P2 指令否决层（DeFoP M1 几何安全监督移植） --------------------------------
  # 指令层最后一道几何保证：对【最终发布指令】（群集/分离/避障/风前馈合成之后）
  # 做刹车包络检查——沿指令方向扫点云走廊（半宽 = drone_radius + lateral_margin，
  # 只计 t>0 的前方点，保证"永不阻挡远离/切向"），取最近沿轨距离 t_near，允许
  # 速度 v_a 满足  v_now·t_react + v_a²/(2·a_brake) + margin ≤ t_near；
  # 超速则等比缩水平指令到 v_a（只缩模不改向）。与 vcap（全向 clearance 减速）
  # 互补：vcap 惩罚逃逸方向，否决层只约束"指向障碍"的分量，切向绕行不受罚。
  # 纯检查层，不反馈进规划（无振荡回路）；关=逐位原行为。
  # 【默认关】2026-08-30 两轮 A/B 定论（run_logs/p2_20260830_202630 + p2b_*）：
  # 首轮 scale 可到 0 → B 臂 highZ 磨树级联 40:0、2 FAIL（veto 冻结弹起后水平
  # 脱离/冻结 de 逃逸指令）；修复包（de 点云走廊检查 + scale_min 地板 + 末次路径
  # 保持 + 停滞看门狗）后 B 臂 5/5 PASS、磨树归零、与 A 臂打平（分 155.0 vs 155.6、
  # 碰撞 16:16）；风场 D 臂无净收益（分 146.5 vs 150）。本栈 vcap+云避障+de 已
  # 覆盖同款几何，否决层冗余且风场略亏 → 保持关。修复包本身独立生效（A43 基线
  # FAIL→PASS），随 de/规划默认带出。若未来出现"指令驱动型碰撞"新形态可重评。
  veto_gate:
    enabled: false          # 【默认关】两轮 A/B 无净收益（见上）
    t_react: 0.2            # 指令跟踪滞后 (s)：现速 v_now 在该时间内按未衰减计
    a_brake: 2.5            # 紧急制动减速度 (m/s²)。保守取值（平台 max_acc=4.0 的
                            # 下界），包络偏大→提前减速，监督层宁紧勿松
    margin: 0.3             # 沿轨安全余量 (m)：包络停住后距障碍的最小距离
    lateral_margin: 0.1     # 走廊半宽加宽 (m)：半宽 = drone_radius + 该值（仅体表
                            # 余量；贴近树侧向绕行不被否决，贴近状态归反应层管）
    ray: 2.5                # 扫描上限 (m)（性能界；最近走廊点超出则必然不触发）
    scale_min: 0.35         # 缩放地板：对齐 vcap 0.35 系数——减速但不完全冻结水平
                            # 进度（scale→0 把"弹起后水平脱离"冻死成磨树级联，
                            # 2026-08-30 P2 首轮矩阵 B 臂 highZ 磨树 40:0 教训）

  # ---- 真机树枝避障（O1-O5 分支算法，2026-09-12 定稿；默认全关=基线逐位不变）----
  # 病灶（真机场景推演）：球冠仅视觉+点云带 [1.5,3.5] 巡航高度（树冠之下全盲）、
  # 一点即占+永久格（树叶闪烁/细枝稀疏回波=幻影/永挡）、反应门 |z-pz|≤0.35
  # （枝在 0.8-2.6m 高度带，巡航 2.5 常被 gate 滤掉）、薄枝 0.4-0.7s 穿越
  # （reactive 0.5m 推距 < 制动 0.63m）→ 高速挂枝。O1-O5 见各段注释。
  # 配套：sim 树枝层=顶层 branches 段（Scene 生成细枝进 raycast/collides/
  # A* 占用）；场景高度带切换=competition_rules.yaml heights.cruise_z 1.8
  # （nav 与 mission 同源读，见 nav_node 同款注释）。
  # 【默认全关】W 系基线 A/B 纪律：任何单旗翻默认须矩阵过线（col 不增 +
  # 无任务级退化）。branch_handling.enabled=false 时 nav 侧逐位原行为。
  branch_handling:
    enabled: true          # O1-O5 总开关（false=现行逻辑逐位不变）
    # 【2026-10-07 换场】本段在新档**失去输入**：场景换成 zx2026_ws 后无真枝
    # （表无 branch_file，world/Scene 均 0 段）⇒ O1-O5 的枝相关活性空转。
    # enabled 仍 true（不关：换场是场景侧，行为参数保持可比；关掉会引入一次
    # 与换场无关的行为差，妨碍日后归因）。枝若从 defop 线回流，本段即恢复作用。
    # O2 点云高度带：band 为 [z_lo, z_hi] 绝对高度（ground_z 相对，见
    # nav_node 转换）。【杨树林 2026-09-23 推；2026-10-02 cruise 2.4 复核；
    # 2026-10-07 换场至 zx2026_ws 场景后重述】
    # 带 [0.70,2.60] **数值不变**（换场是场景侧，行为参数保持可比），但两代
    # 论据均已作废，新档下本上界的承重依据**待裁**：
    #   · 「带上限 2.60 < 冠下缘最低 2.81」——10-02 冠双删时作废；
    #   · 「带上限 < 最低真枝世界 z 2.88」——**10-07 换场后真枝全去**（表无
    #     branch_file）⇒ 本论据作废，2.60 在新档不再由真枝推得。
    # 现承重的：树干点全高进图（2D 投影同格，任意 z 切片即可封干）、围栏
    # （顶 2.80）进带=真实侧墙（pads 在围栏内，不存在"绕环外 OOB"旧病灶）、
    # 地面 0 在带外（真机地面滤同型防线的仿真侧）。
    # 旧不变量"带下限 > 围栏顶"仅适用越冠顶体制（越障飞行），作废。
    # 低空段 (投放 0.8) 依赖 O3 反应层近场（hband 0.65 盖到 z≥0.55，
    # ca_z_floor 0.5 挡地面）而非全局图。
    map_z_band: [0.70, 2.60]
    # O1 证据积分占用：窗口内计数替代"一点即占"。每点计 +1，重建时窗口
    # (window_s) 外未重观测的格遗忘；occupied = cnt ≥ sway_dense_factor×T
    # （T 近/远分档，trust_r 内按近档；密度线以上=树干/密枝簇=刚性封格），
    # uncertain = 1 ≤ cnt < 判占线——细枝稀疏回波不封格，走 O4 限速可生存
    # 接触。20260912 分支矩阵定论（run_logs/matrix_branch_20260912_214135
    # + _iso）：旧 T 线判占（细枝 2 次回波即封格）闭合树间走廊 → 森林内部
    # A* 不可穿 → 北绕界外 OOB 退赛 + 西入口墙滑扫（B 臂 0/3 PASS；切除
    # O3/O4/O5 均 retired=5 不解 → 根因在判占线本身）。
    evidence:
      window_s: 1.5         # 遗忘窗口 (s)（滑窗 TTL，取代永久格——风摆的枝
                            # 摆走即忘，不再"摆走→永挡路"）
      thresh_near: 2        # 近档阈值基数（trust_r 内；判占线 = ×sway_dense_factor）
      thresh_far: 4         # 远档阈值基数（trust_r 外；同上）
      trust_r: 5.0          # 近/远分档半径 (m)，与 lidar range 同量级
    # O4 不确定减速：弱证据格（有观测但未达判占阈值）不判死，进否决层扫描
    # ——沿指令走廊遇不确定格把允许速度压到 v_max（不是 scale 0 冻结），
    # 治"薄枝稀疏回波判不死、高速盲穿"。与 veto 的 occupied 扫描同走廊同
    # 减速几何（margin/lat_margin 复用其语义）。
    uncertain:
      enabled: true         # 随总开关生效（总开关关时整体不读）
      v_max: 0.6            # 跨不确定格限速 (m/s)（≈de 逃逸基速量级，可生存接触）
      margin: 0.3           # 沿轨安全余量 (m)，同 veto_gate.margin
      lat_margin: 0.15      # 走廊半宽加宽 (m)，同 veto_gate.lateral_margin
      ray: 4.0              # 沿指令走廊扫描上限 (m)（同 veto_gate.ray 语义）。
                            # 4.0 ≥ 稀疏枝首见距离(~3.5m)：薄枝一进视野即进限速窗
                            # （若 2.5，首见圈枝格在窗外，进窗时已判占=O4 空转）
    # 判占密度倍数：cnt ≥ 该值×T(dist) 才封格（树干/密枝簇=刚性）；以下的
    # 细枝证据进不确定档由 O4 减速（判占线即由此键定义）。O5 风摆膨胀已随
    # 判占线重设计退役：作用对象"低证据占用格"在新结构停留 UNC 不封格，
    # 无膨胀可言（旧形态把细枝格膨胀 2 格是走廊闭合加剧者——iso 矩阵
    # noO5 臂 stuck 71.9→10.8s 但 retired 形态不解，根因在判占线）。
    sway_dense_factor: 3.0
    # O3 反应层高度门/半径放宽：云避障与否决层共用 gate |z-pz| ≤ dr 滤点，
    # 巡航 2.5 vs 枝 0.8-2.6 常在带外被滤——+ca_height_extra 放宽门、
    # +ca_react_extra 延长反应半径（反应窗 0.5m < 制动 0.63m 的根因量）。
    ca_height_extra: 0.3
    ca_react_extra: 0.6
    # O3 反应层绝对下限：低于此高度的点不进反应扫描（地面 0/路缘 0.32/
    # 平台面 0/桶沿——着陆与投放面）。无此门时放宽后的 hband≈0.65 把地面
    # 拉进扫描 → 返场末段下降被向上推抵消，全员悬停在 z≈hband 落不了地
    # （matrix_branch_20260912_231105：B 臂投送 6/6+零退赛但 landed_n=0，
    # z 冻 0.65-0.7 vs A 臂 -0.05）。0.5 < 枝下沿 0.8，枝可见性不受影响。
    ca_z_floor: 0.5
    # ---- Wave B ①-③（2026-09-14 单旗 A/B；②云记忆过线翻默认，①③留旗 pilot） ----
    # ① 接触域标记（contact_mark）：病灶=_collision_obs 只标机体所在单胞
    # （est_pos 格），碰撞点 ~drone_radius 0.35m 在相邻胞——梢胞从未被标，
    # 恢复后同梢原位复碰（v1.2 矩阵 B 臂 11 起里 10 起细梢擦碰 r=0.012-0.019，
    # 67% 同梢复碰族）。修：标记接触域 0.65m 盘（drone_radius 0.35 +
    # drift_max 0.3 预算——漂移任意方向都盖住梢胞）。硬占用、不膨胀（O5
    # 铁律：接触标记只挡原点，膨胀=封廊道）；插在足迹清除之前（自机脚下被
    # 本拍足迹重开=结构性防自封：恢复路径起点永不被自己的标记封死，远端
    # 标记保留绕开）；ttl 到期遗忘（旧 _collision_obs 永久格：一次碰撞永挡路）。
    # 自碰不自标只广播：碰撞事件已在 /drone_i/collision 话题广播（world_node
    # 发布、逐机话题），本机只标自己的接触域。
    contact_mark: false       # 接触域标记总开关（默认关）
    contact_radius: 0.65      # 接触盘半径 (m) = drone_radius 0.35 + drift 0.3
    contact_ttl_s: 12.0       # 标记寿命 (s)：覆盖弹开 1s+冷却 2s+恢复再进近窗
    # ② 云缓存梢记忆（cloud_mem_frames）：病灶=self.cloud 单帧 wholesale
    # 替换——梢点只在偶发帧可见（sim 传感 504 射线/帧 vs 真机 Livox Mid-360
    # 20000 点/帧，sim 悲观 20-50 倍；进近末段 ~1/3 帧全盲）。修：bh 开时
    # 保留最近 N 帧点（世界系真值点不随自机移动）。安全：反应层/否决层/
    # sep_obs_guard 都只作用"正在接近"的点（v_in/v_app/into>0 门）——身后
    # 过期点零推；建图走本帧 pts 不受影响。孤立点判定阈值已随帧数缩放
    # （nav_node ≤max(3,frames)，20260918）：N 帧记忆下梢点 N 帧回声仍判
    # 孤立，密枝簇单帧即 >3 点不受扰——时窗与孤立判定解耦，N 不再受
    # "上限 3" 约束。
    cloud_mem_frames: 6       # 保留最近 N 帧梢点（0=关逐位原行为）。20260914 waveb
                              # 矩阵过线翻默认 3（H 臂 lissajous+本键捆绑 col 2.0→
                              # 0.7；单开 D 臂中性——与 lissajous 必须捆绑）。
                              # 20260918 枝梢时窗 A/B 翻 6（run_logs/
                              # tip_matrix_20260918_163047）：3 帧 0.3s < 反应窗
                              # 穿越时间 0.41s（react_r 1.10m @1.8m/s）——梢点窗
                              # 入口Seen 一次，遗忘时还剩 0.19m 贴脸。6 帧 Σcol
                              # 12→7、score 100×6 vs A 90×2、类分布零挪移（两臂
                              # 残余 100% branch_TIP），minclr 5/6 cell 改善。
    # ③ 孤立点斥力地板（ca_iso_floor）：病灶=sign_fix 推力 push = v_in+距离
    # 项——切向擦过 (v_in≈0) 或包络边缘 (danger≈react_r) 的孤立梢点只产生
    # 0.1-1.2 的推，小于巡航 1.8 的进近速度：看得到梢仍被推进去（10-15%
    # 余量带）。修：孤立点（1m 内 ≤3 点，防误伤密枝簇）的 push 抬到 ≥ 本值
    # （2.0 > cruise 1.8，至少抵消进近）。只作用于 sign_fix 分支正在接近
    # (v_in>0) 的点。
    ca_iso_floor: 0.0         # 0=关（逐位原行为）；>0 = 孤立点最小推速 (m/s)

    # ---- W7-C3 TIP 预测性减速（三臂之三；默认关，pilot 串行验证） ----
    # 法证：d3#3 撞点距树轴 1.96 > 冠阈 1.55=物理枝干伸出 nav 冠模型（TIP
    # 超模型）；d2#1 nav 自估 clr=1.18 照撞（冠缘稀疏回波被孤立点滤/消化
    # 滞后吃）。现有反应门 |z-pz|≤dr+0.3 对冠区上半（z 2.5-3.0）盲。机制=
    # 沿指令前向锥扫枝梢 z 带云点（self.cloud=mem6 聚合，记忆窗≥反应窗穿越
    # 0.41s 定量律反演 react_t），d_edge → v_cap=(d_edge-margin)/react_t，
    # 地板=max_vel×floor_frac（与 vcap 地板同源）。只缩模不改向；min_pts
    # 门防孤立噪声误刹；与 vcap/O4 取交（更严者生效）。
    tip_slow:
      enabled: false          # 【默认关】C3 pilot 串行（B 判据定谳后单独 A/B）
      z_band: [0.70, 2.60]    # 【杨树林 2026-09-23】冠下巡航带全高（树干证据）；旧 [1.5,3.0] 越冠顶体制作废
      cone_deg: 35
      engage_r: 2.5
      margin: 0.5
      react_t: 0.41
      min_pts: 2
      floor_frac: 0.35

# ---- 仿真树枝层（**已废置**：真枝改由树表 meta 驱动，见下） --------------------
# ⚠ 2026-10-01：杨树改用**真枝**（与 wood mesh 同源的枝段，由
#   tools/extract_poplar_branches.py 抽出，经 forest_poplar_table.yaml 的
#   meta.branch_file 装载，Scene._attach_real_branches 实例化）。真枝**覆盖**
#   本段生成的 procedural 细枝，故本段对带 branch_file 的表不再有任何效果，
#   保留仅为旧表/回退路径。别把它当成真枝的开关——上面那个 meta 键才是。
# 每树生成 per_tree 根细枝：世界系线段+半径（起点在树干表面，水平略下倾）。
# 枝参与 lidar 射线（稀疏回波=真机 2cm 枝 @5m ~4% 命中率的同量级复现）、
# 硬碰撞、A* 占用；球冠仍仅视觉不动（设计律）。确定性：独立 br_rng 流
# （种子=森林种子×run_seed，绝不扰动森林 rng——同 seed 有枝/无枝场景树干
# 逐位一致，branch_selftest 对照实证）；同布局不同枝形，A/B 跨 seed 有变异。
# 真机算法侧开关=closed_loop.branch_handling。
branches:
  # 【杨树林场景 2026-09-23 关】外部 SDF 场景契约=树干+冠包络两圆柱碰撞
  # （枝叶只在视觉 mesh 里）；仿真细枝层会在杨树上额外长出 procedural 枝
  # （与 mesh 视觉冲突且 gz 侧 world_builder 会把它们建成物理圆柱）。
  # 现役科目三网格场景恢复 true 即回旧行为。
  enabled: false
  per_tree: [3, 5]          # 每树枝数（含空树）
  z_range: [0.8, 2.6]       # 枝下沿-上沿 (m，ground 相对)
  len_range: [0.6, 1.6]     # 枝长 (m)
  r_range: [0.008, 0.022]   # 枝半径 (m)（细枝 1.6-4.4cm 直径）
  el_range: [-0.5, 0.3]     # 枝俯仰 (rad)，水平略下倾=常见枝形

# ---- 碰撞恢复 ----------------------------------------------------------------
# 碰撞后弹开 + 冷却 + 恢复，替代永久冻结。
# enabled=false 回退到原行为（碰撞后永久冻结）。
collision:
  recovery:
    # true=弹开→冷却→恢复（风场时代调参验证过的序列，R1: max_collisions 3→5→8）。
    # 20260913 树枝矩阵 095951 定谳：false 时一次碰撞=无日志永久冻结，B 臂全部
    # match 缺口（B42 d3/B43 d0/B44 d3d4 碰枝 z≈1.8）皆此因——枝带与巡航 1.8
    # 重叠，穿越必有接触风险，碰一次即冻死与"可生存接触"的 O4 设计矛盾。
    enabled: true
    bounce_dt: 1.0            # 弹开阶段持续 (s)
    cooldown_dt: 1.5          # 冷却冻结阶段 (s)，弹开后悬停等待
    bounce_vel: 2.0           # 弹开速度 (m/s)，≤ cascade_pid.max_vel (2.5)。
                              # 1.2 试错否决（170650 矩阵）：短甩把恢复点留在枝丛
                              # 接触包络边，目标吸引 1.3-2.4s 内原位回碰（B42 d4
                              # 三连碰间距 0.19-0.35m、B43 双机同型 0.09m），B 臂
                              # col 1.67→4.3。2.0 甩掷虽乱但可靠脱离接触域
    max_collisions: 8          # 超过此次数永久冻结（R1 调参 3→5→8：风场启用后窄走廊
                              # 阵风瞬态会撞树，碰撞标记逐次封堵树丛需 ~5-7 次/机才绕开；
                              # 8 次保任务完成，撞树仍作保真度信号。无风基线 0-1 次/机）
    lock_cmd: true            # 恢复期指令隔离：碰撞弹开/冷却/冻结期间丢弃执行器 vel_cmd
                              # （否则 20Hz 指令流逐拍覆盖恢复指令，架空冻结→着地机被
                              # hover 回拉持续压入地下，run4/5 法证 d1 沉至 z=-3.56）
                              # ⚠ 只在 python 后端 world_node.py 实现（_on_vel_cmd 丢弃）；
                              # Gazebo 后端 gazebo_collision_monitor 从不读本键，消费端是
                              # C++ 插件 —— 该缺口由下面 yield_actuator 在生产端补。
    yield_actuator: true      # 恢复期让出执行器（ego_bridge 专用）：true=碰撞恢复窗内
                              # 桥不发任何令（含零），vel_cmd 整窗归 gazebo_collision_monitor
                              # 独占（弹开 100Hz→冷却零速），/collision 下降沿交还（边沿自
                              # 同步，无需在桥里镜像 bounce_dt/cooldown_dt）。
                              # false=旧行为：桥发 SETTLE_S 零速，经 nav 中继以 50Hz 上
                              # /vel_cmd，与监控器弹开令逐拍对撞掐死逃逸脉冲——2026-10-07
                              # 仪器化冒烟实测 d2 被令 2.0m/s×1.0s 只位移 0.10m、离撞点峰值
                              # 0.25m（<0.60m 判楔死）= R1 类成因。留 false 作 A/B 臂。
    park_ground_skip: true    # 停机豁免：armed 过的机永久跳过地面子句（touchdown 解除
                              # armed 时 z≈0.27 仍在空中，触地子句会把着地机判成碰撞弹跳）
    low_bounce_up: true       # 低空弹开钳位：z<1.0 弹开垂直分量一律向上（爬升中被撞
                              # rev 向下会把机压进地面，run6 二次触地 z=0.01 级联）
    fence_events: false      # W5：围栏纳入碰撞事件集（默认关待 A/B）。西围栏顶 1.30
                             # 托住低空穿行的 d5（坐顶 z=1.40），原监控器对围栏
                             # 接触零事件零恢复；true=fence AABB 走 bush 同款
                             # 球-AABB 检测+弹开。

# ---- 传感器噪声 ----------------------------------------------------------------
sensor:
  lidar:
    range_noise_std: 0.02     # 测距噪声标准差 (m)，与距离成正比
    dropout_rate: 0.05        # 射线随机丢失率 (0-1)
    angular_noise_deg: 0.5    # 角度噪声 (deg)，使射线方向微偏
    false_positive_rate: 0.0  # 随机误检率 (0-1)，默认关（真机 lidar 误检率低）
    lissajous: true           # 【默认开】花式扫描模拟（Wave B G/H/I 臂）：每帧俯仰
                              # 环组随机平移 ±0.09 rad，模拟真机 Mid-360 非重复扫描的
                              # 时间积分——固定环垂直覆盖离散成 0.10 rad 空隙，细梢
                              # （角尺寸<环隙）落空隙恒盲；每帧平移后多帧积分覆盖连续
                              # 化，恒盲梢变闪烁可见，激活云记忆/孤立地板。零额外射线
                              # 成本。20260914 waveb 矩阵过线翻默认：单开 G 臂 seed 脆
                              # （s43 唯一 FAIL 85 分），必须与 cloud_mem_frames 捆绑；
                              # OFF 时不消耗 rng、射线逐位同旧行为（回退可比性保留）
  tag:
    range_noise_std: 0.05     # 距离测量噪声 (m)，影响 confidence
    false_negative_rate: 0.05 # 漏检率，与距离成正比（越远越易漏检）
  camera:                   # 下视相机合成图像源（camera_sim_node；唯一开关=
                            # competition_rules.color_id.source，无独立 enabled）
    fps: 12                 # 出图帧率（检测器按帧出检测；消费者 20Hz tick 取最新，
                            # 重复帧等值——锁定时序由 scan_dwell_s 决定，与帧率解耦）
    width: 320
    height: 240
    vfov_deg: 95.0          # 垂直 FOV：0.8m 悬停 + 0.4m 水平偏移仍含 rim r=0.68
    gain_std: 0.06          # 每帧乘性曝光抖动
    pixel_noise_std: 6.0    # 逐像素高斯噪声 (8-bit)
    dropout_rate: 0.02      # 整帧丢失率（相机断帧）
    render_crowns: false    # 树冠入画默认关=与 scene.raycast 遮挡集一致

  depth:                    # 前视深度相机（D435 式合成渲染，DeFoP 导航图像源，
                            # 2026-09-28 P1 立项）。自门控约定（新）：本段缺失或
                            # enabled=false 时 depth_sim_node 启动即退、零发布者，
                            # INFO 一次——默认关=零侵入基线，DeFoP 联调时手动开。
    enabled: true          # 【默认关】新约定：depth 段自带独立 enabled 开关
    fps: 15                 # 出图帧率（DeFoP 契约 15Hz）
    width: 480              # DeFoP 契约 480x270
    height: 270
    hfov_deg: 87.0          # 水平 FOV
    vfov_deg: 58.0          # 垂直 FOV（fx/fy 各轴由 hfov/vfov 精确导出，
                            # 480x270@87/58 下 fx≠fy≈4%，camera_info K 为权威）
    max_range: 10.0         # 最大量程 (m)；无命中=10000 毫米哨兵，超量程/欠程置 0
    noise_std: 0.02         # 命中距离高斯噪声标准差 (m)，D435 主动双目量级
    min_range: 0.2          # 近盲区 (m)，<0.2m 置 0（无效）
    dropout: 0.02           # 命中像素随机丢失率（D435 缺相关置 0 同型）
    render_crowns: true     # 树冠入画（竖直圆柱：与 scene.raycast/判官/物理
                            # 同源——2026-10-02 球→柱修复；仅有冠且
                            # crown_collidable 的树入画）。
                            # 【2026-10-07 换场后本键**恢复实效**】：表 meta
                            # crown_collidable=true（冠=物理+视觉）⇒ 冠门开，冠
                            # 入画，本键开关真实生效（不再是 10-02~10-07 的 no-op）。
                            # 两门（crown_collidable / render_crowns）切同一批冠像
                            # 素这一定谳，由 defop_depth_selftest.py [6] 的跨门
                            # 恒等式把守。
    cam_pitch_deg: 0.0      # 相机俯仰（正=机头上仰），默认水平前视
    render_boxes: true      # 【2026-09-29 T1 盒原语】盒障碍 AABB（西林缘网
                            # kind=net/围栏/灌木等静态盒）入画：slab 法向量化，
                            # 并入"预筛→精确求交→min-t"管线，Z 深度/哨兵/0/
                            # dropout 语义与树干/树冠/树枝原语逐字节一致；
                            # 模型同 geo.ray_aabb（scene.raycast 盒真值口径）。
                            # P3 A/B 前提=双臂同世界认知（此前网不入画，DeFoP
                            # 臂对网盲；真机网失明是 P4/P5 装订兜底项，与本键
                            # 无关）。本段 enabled 默认 false 故基线零侵入；
                            # 代码缺省 false=键缺失时旧图逐位。
    tree_prefilter: true    # 【2026-10-01 渲染提速】树级两级预筛：
                            # ①视锥剔除（整树/单原语在视锥外、超量程或身后则
                            #   连掩膜都不算——原预筛只看水平距离，相机身后
                            #   的树白算；真枝多在平视 58° 视场的上缘之外）；
                            # ②射线子集（每棵候选树一个罩住 干+冠+全枝 的
                            #   外包球，一次掩膜切出子集，干/冠/枝的掩膜与求交
                            #   全在子集内做——掩膜是 O(129600) 全幅扫描，此前
                            #   每棵树的每个原语各扫一遍，真枝 1888 段使林内
                            #   单帧达 165-185ms，超 15Hz 的 66.7ms 预算 2.5×，
                            #   六机分摊后 depth 链降到 ~1.5Hz）。
                            # **纯提速、逐位无损**：两道都只做排除，包围球半径
                            # 带 PAD 严格包含原语、视锥判据用半径整体代入；关掉
                            # =false 时无剔除且子集=全幅，表达式与改前逐位同算
                            # （tools/defop_depth_selftest.py [8] 断言 on/off 两图
                            # 逐字节一致）。代码缺省 true（它算的是同一张图）。

# ---- 时间管理 ----------------------------------------------------------------
world_dt: 0.01             # 物理步进
control_dt: 0.05           # 指令下发周期
publish_dt: 0.05           # odom 发布周期
use_sim_time: true         # 平台发布 /clock，全图使用 sim time

# ---- 风场模型（仅作用于无人机动力学，树冠保持仅视觉） -----------------------
# 物理：acc += (wind - vel)/tau_aero（气动阻力拖向风速），控制器下一拍自然反推。
# 组成：定常风 mean + 共享慢变阵风（OU, τ=gust_timescale_s）+ 每机独立湍流
#       （OU, τ=turb_timescale_s）。只加水平分量（垂直由任务高度控制）。
# 门控：仅 P4_EXECUTE（穿越/投放/返航）生效；P1/P2 停靠、P3 起飞、P5 后不施风。
#       P3 起飞窗口不施风：pads 1.5m 间隔 + 错峰起飞是碰撞最脆弱窗口（R1 实测）。
# 冷却冻结期跳过。
# 约束：持续风必须 < ~0.8 m/s（无前馈时导航平衡偏移 δ=w/1.2 vs 投放到位阈值 0.8m）。
# R1 验证：无前馈时任何有意义风档（0.4/0.25、0.25/0.15、0.2/0.1 均试过）都让任务
#   无法完成——风致横漂撞树 → _collision_obs 永久占用 → 投放点不可达 → 接近死循环。
#   修复：nav 风前馈（feedforward=1.0，nav_node 指令减去共享风）→ 稳态偏移降 ~6 倍，
#   0.4/0.25 档可恢复正常任务节奏。每机湍流不补偿（残差抖动，符合真实系统）。
# 验证矩阵（swarm 开）：R1 单独风 DONE@360s/152 分/13 撞全恢复；R3 风+通信
#   DONE@347s/148 分/13 撞全恢复，均 6/6 DONE+MATCH 无永久冻结。
# 【默认关】：用户决策——保持零侵入基线，压力测试时手动开（enabled 改 true）。
wind:
  enabled: false           # 【默认关】压力测试时改 true
  mean: [0.0, 0.0]         # 定常风 (m/s)，z 恒 0
  gust_std: 0.4            # 共享阵风 OU 标准差 (m/s)（typical≈0.47、峰值≈1.2）
  gust_timescale_s: 4.0    # 阵风相关时间 (s)
  turb_std: 0.25           # 每机湍流 OU 标准差 (m/s)
  turb_timescale_s: 1.0    # 湍流相关时间 (s)
  tau_aero: 0.6            # 气动响应时间常数 (s)
  feedforward: 1.0         # nav 风前馈系数（0=关；1=全补偿共享风）

# ---- 通信模型（邻居信息无线链路：延迟 + 丢包 + 突发丢失） --------------------
# 独立中继节点 comm_model_node：订阅全部 /drone_i/odom，对每条链路 (s→r, s≠r)
# 施加模型后发布 /drone_<r>/odom_from_<s>；本机 odom 不经过模型（自身传感器，
# 定位不确定性由 closed_loop.drift 覆盖）。失联语义：nav 侧超过 expire_s 未更新
# 的邻居被移除（"感知不到的避不开"，群集/分离自然跳过）。
# 注意：release 必须发布队列【最老】q[0]（FIFO）——发布"最新"（newest-wins）会
# 把有效延迟塌缩成 ~1 帧（R2 假通过教训，实测 10ms→修复后 155ms）。
# 验证矩阵（swarm 开）：R2 单独通信 DONE@176s/153 分/1 撞已恢复；R3 风+通信
#   DONE@347s/148 分/13 撞全恢复，均 6/6 DONE+MATCH 无永久冻结。
# 【默认关】：用户决策——保持零侵入基线，压力测试时手动开（enabled 改 true）。
comms:
  enabled: false           # 【默认关】压力测试时改 true
  latency_ms: 100          # 基础单程延迟 (ms)
  latency_jitter_ms: 40    # 每消息抖动，均匀 0..jitter (ms)
  dropout_rate: 0.02       # 单消息独立丢包率 (0-1)
  burst_prob: 0.002        # 突发丢失起始概率（每链路每秒）
  burst_len: [3, 10]       # 突发 = 连续丢 K 条消息
  expire_s: 2.0            # nav 侧邻居过期时间 (s)

# ---- 规划器来源（P3 DeFoP shadow 模式开关） ---------------------------------
# source=internal：现行内部规划器全权（默认，与历史行为逐位一致）。
# source=defop   ：DeFoP 臂（T2/T4 消费：defop_nav 图像源/影子模式接管）。
# source=ego     ：ego 臂（2026-10-05 ego 路线：ZJU ego-planner 当笔，ego_bridge
#                  发 /planning/cpn_vel_raw 中继，nav 白名单 'ego'——镜像 defop
#                  全套持笔契约。联锁：stack_nodes ego_arm:=true + 本键同帧装订。
#                  docs/EGO_DESIGN.md）。
# 2026-09-29 T1 新增键位装订；消费方=nav_node.vel_source_of（P3 终端交接
# 闸门；键缺失/不识一律 internal=零行为变更）。语义详见 depth_sim_node
# （图像源）与 P3 任务书。
planner:
  source: ego     # internal | defop | ego（ego 路线 2026-10-05）
  # 持笔权主键（docs/pen_authority_case.md 刀一，2026-10-04）：nav=逐字节旧
  # 行为（默认）；cpn_forever=规划器全程持笔——捆绑三件不可拆（nav departure
  # 门旁路 + nav stall 冻结看门狗 + executor 起飞暖机闸门）。ego 档：前两件
  # 复用（桥发同名 cpn_vel_raw/debug），第三件 executor 判 source=='defop'
  # 恒 False 自动不启用（ego 无模型秒就绪，闸门依赖不存在）。
  pen_authority: cpn_forever
  # CPN 拍间隔超此值（秒）⇒ nav 冻结零速悬停（仅 cpn_forever 生效）。
  # plan_rate 名义 10Hz 实测 2-5Hz（健康间隙 ≤0.5s），1.0 = 2× 最差健康值。
  pen_stall_freeze_t: 1.0
  # 雷达点云链总开关（2026-10-05 用户裁决：避障=深度图单源，纯 DeFoP+坐标）：
  # keep=旧行为（默认，lidar 照发+nav/executor 照订）；off=三处同关——
  # lidar_node 停发（省 6×0.83s/帧 raycast CPU，真枝成本家族大头，回流深度链）
  # + nav 不订 /cloud（self.cloud 恒空：占用栅格空=A* 直线、云反应层/
  #   sep_obs_guard/DE 云走廊全优雅退化；minclr 指标口径死亡=1e9，读账走
  #   col/done_t/min_dclear）+ executor via_slots 不订（占用格空=槽位全净空）。
  # 定位=odom/ENU 坐标（与云无关）；巡航避障=CPN 深度链（配 pen_authority）。
  cloud_nav: off
  # ---- 全局路由器（2026-10-06，用户裁决「ego 引入全局规划器」）----
  # 病灶：mission 只发单点 goal，ego 的「全局参考」是一条直线 min-snap
  # （planner_manager.cpp:457-519），getLocalTarget 又把它裁到
  # planning_horizon 7.5m（ego_replan_fsm.cpp:899-954）⇒ 任何长于 7.5m 的
  # 横墙 = 局部极小值 = 死锁。d5（pad y=+3.75 → drop y=+9）的直线恰好切入
  # 遮阳网 y 带 [4.0,12.0] ⇒ 实测被顶死在 x≈-23.1。
  # 开关在 launch：gazebo.launch global_route:=true（默认 false=逐字节旧行为）。
  # 本节只放**调参**；关臂时本节点根本不起，本节不生效。
  global_route:
    # 占用源。net_only=只把 kind=net 当障碍（scene_topology.yaml:86-90 的
    # 「装订禁行源」）——真机 Mid360 对遮阳网结构性失明，这等价于把
    # 「已知禁行区」装订进规划器，**不含 oracle 知识**，可迁移。
    # scene_truth=直接用 Scene（含 203 棵树）——**oracle，诊断专用**，
    # 与 via_slots source=cloud 的诚实化裁决冲突，不可迁移，只作 sim 上限量尺。
    source: net_only
    resolution: 0.5
    inflation: 0.45         # A* 格占用膨胀（须 >= 机身半径 0.35 + 余量）
    los_pad: 0.45           # 路线离障门（细采样口径，见 los_step_fine）
    z_lo: 2.0               # 规划层下沿（低于网顶 2.50 ⇒ 网参与占用）
    z_hi: 2.9
    hop_max: 5.0            # 航点最大间距（< planning_horizon 7.5 才有意义）
    min_route_len: 3.0      # 短腿直通（末段降落/识别腿不路由）
    advance_dist: 1.5       # 推进到下一航点的距离门
    min_pub_dt: 0.3         # 重发最小间隔（s）
    stuck_skip_s: 8.0       # 单航点卡死放行门（s，每点最多跳一次）
    los_step: 0.25          # 粗采样步长（快速下探用）
    # 细采样步长：**A* 对角线会切障碍角**——两格心各自净空，连线最近点却能
    # 掉到 pad 以下（实测 d5 的 (-23.5,4.0)→(-23.0,3.5)：格心 0.65/0.52，
    # 连线 0.4596 < 0.45）。粗采样一步跨过窄违例带 ⇒ 必须细采样复核。
    # 配合 arena_nav/astar.py 的「禁切角」改动（双保险）。
    los_step_fine: 0.05
    los_span: 60

    # ==== 碰撞 / 越网冻结同源治理（2026-10-06，§9.14）====================
    # 病灶同源：gazebo_collision_monitor.py:235 —— 累计第 9 撞 ⇒ 本局**永久
    # 零速**。**冻结 ≡ 第 9 次独立碰撞**（冻结那拍不记 COLLISION #9）。
    #
    # ⚠️ **2026-10-06 订正（批 1 实测，勿再沿用旧口径）**：曾以为「一次 10-15s
    # 物理楔死被 bounce→cooldown 重入放大成 4-6 撞、扣掉重入簇即可防住全部
    # 冻结」。**已证伪**。两台冻结机的相邻碰撞间隔为 [2.5,18.0,7.1,13.7,21.6,
    # 65.6,13.0] 与 [2.6,3.0,7.2,9.2,6.9,18.4,6.7]，落进监视器**真实 2.5s 窗**
    # 的重入只有 **1 起 / 0 起**，全批最大簇**仅 4 起**。误判根源=离线聚类用了
    # 自定的 1m/5s 阈值去解释一个 2.5s 的机制（窗开大一倍就把独立遭遇并成了
    # "放大"）。**教训：聚类窗必须取被解释机制的实参。**
    # ⇒ 唯一真路径是**降低碰撞次数本身**，不存在"反楔死"捷径。
    #
    # `govern` 是**总闸**：false 时下面四组全部不生效 ⇒ 退化为原 `_NetOnly`
    # 行为，与 2026-10-06 之前逐字节同。**A/B 单变量 = 改这一行。**
    #
    # ✅ **2026-10-06 翻默认 = true（批 2 裁决，n=6/臂交错）**。四条预登记判据
    # 全过、零杀线（案卷 §9.16）：
    #   · **frozen 0 局/0 台 vs 4 局/4 台**（头条；Fisher p≈0.05）
    #   · **landed 3.67/run vs 1.00/run（3.67×）**，22/36 vs 6/36
    #   · **Σcol 均值 18.5 vs 27.2（−32%）**（Mann-Whitney U=29/36，p≈0.04）
    #   · 越网 35/36 vs 35/36（**零代价**）、判据⑤ 频率无劣化
    # 机制读数（关键）：`verdict=correct` 27 vs 28、`s1` 合计 270 vs 280
    # **两臂持平** ⇒ govern **不改任务完成度，只把"做完没回来"变成"做完且回坪"**
    # （B_1 是标本：5 台 s1=10 verdict=correct，**0 台落地**）。
    # **OVER_HEIGHT 在 G 臂 2/6、B 臂 2/6 完全对称** ⇒ 坐实 §9.14 订正四
    # （它**不是**治理引入的失败形态），该杀线作废。
    # 已知边界：本批 G 臂**含 z 支持**（§9.15），故 G 臂的批 1↔批 2 对比被污染，
    # **不可用于归因 z**；四机制仍是**捆绑**的，谁在起作用未单独归因（批 2 候选）。
    # 回滚 = 本行改回 false（下面四组随之全关，逐字节回到旧行为）。
    govern: true

    # (1) 学障碍：订 ego 规划器的 `/grid_map/occupancy`（**ego 自己深度图的
    #     产物**，world 系点云；grid_map.cpp:859 publishMap 按需发布——没人订阅
    #     就**不序列化**，所以关掉本项零成本）。累积成世界系整数格，只认
    #     **本机看过**的世界：与 via_slots source=cloud 的诚实化裁决同源，
    #     树坐标真值表从不参与。目标 = 让 ego 的全局参考不再**首程**就穿过
    #     它已经看见的树列。
    #     已知边界：FOV 外/背后学不到 ⇒ 侧向盲区那一族撞（§9.9 ①）管不到。
    learn_obs: true
    # **话题全名必须带规划器节点名**：advanced_param_zx.xml:46 的节点叫
    # `drone_<i>_ego_planner_node`，publishMap 发的是**相对名**
    # `grid_map/occupancy`，而该文件的 remap 段只覆盖 odom/cloud/pose/depth/goal
    # ⇒ 实际落在 `/drone_<i>_ego_planner_node/grid_map/occupancy`。
    # 2026-10-06 冒烟实锤：订 `/drone_<i>/grid_map/occupancy` 时 Publishers=None
    # （那个话题只因误订而存在）⇒ 六机全学不到东西。`{i}` 由节点替换为机号。
    obs_topic: "/drone_{i}_ego_planner_node/grid_map/occupancy"
    # 观测带（2026-10-06 补齐 z：2.0/2.9 → 1.5/3.5）。
    # 实测撞点 z 域 **1.0–4.41**，原窗 2.0/2.9 与真实撞高**错配**（G 臂 63/79
    # 撞点在带内、B 臂只有 36/77）⇒ 放宽到 1.5/3.5。
    # **上限为什么是 3.5 不是 4.5**：`grid_map.cpp:887` 把
    # `pos(2) > visualization_truncate_height_(3.5)` 的体素在**发布路径上直接
    # 丢掉** ⇒ 写 4.5 是**永不生效的死旋钮**。要看见 3.5–4.41 那段，真正的
    # 杠杆是抬 `ego_zx/config/advanced_param_zx.xml:128` 的
    # `visualization_truncate_height`（本轮不动：属 ego 栈参数，混进本批会污染
    # A/B 归因）。**放宽是安全的**，因为学习格已带竖直区间（_learned_hit 按
    # 相交判定）⇒ 带外的格不会假堵巡航走廊。
    obs_z_lo: 1.5
    obs_z_hi: 3.5
    obs_cell: 0.5
    obs_hz: 2.0             # 解析限频（发布端固定 9Hz，不由我们控制）
    obs_self_r: 0.6         # 丢弃机心附近的点（ego 已清自足迹，双保险）

    # (2) 反楔死：碰撞点动态禁行盘 + 撞后撤退航点
    hazard_learn: true
    hazard_r: 0.8
    hazard_ttl: 0.0         # 0 = 本局持久（对齐 hazard_share「事件真值独立持久」）
    # 激活门：碰撞瞬间机心就在盘里，立刻入盘会让 A* 起点被占（astar.py:64-66
    # 返回 [start]）⇒ _plan_route 退成 pass-through ⇒ 直线又把它拉回树里 =
    # **反而强化病灶**。所以等监视器的 bounce 把机推到盘外才入盘；超时强制。
    hazard_clear_margin: 0.5
    hazard_activate_max_s: 2.0
    hazard_merge_m: 0.75    # 合并半径（同点短时多撞只建一个盘；注意"重入放大
                            # 成 4-6 撞"的说法已于批 1 证伪，见本节顶部订正）
    hazard_max: 40          # 上限淘汰：有界，防累积吃掉全部走廊
    # **goal 豁免**：项目内血案先例——sim_settings.yaml:425 记永久
    # _collision_obs 占格曾把投放点变成不可达 ⇒ 进近死循环。危险盘绝不能压住
    # mission goal，本半径内的一律不入盘。
    hazard_goal_exempt: 1.5
    # 全队危险格广播（nav_node.py:871-877 发、hazard_share 默认开）：默认**关**
    # ——他机盘可能掐掉本机走廊，先当独立臂验证，不进批 1 的决定性单变量。
    hazard_fleet: false
    replan_min_s: 1.0       # 重规划限频（防学习格/危险盘流式到达导致路线抖动）
    escape_back: 2.5        # 撤退距离（沿反向接近向量）
    # 撤退窗须盖住**监视器占有执行器的整段时间**（bounce_dt 1.0 + cooldown_dt
    # 1.5 = 2.5s，其间 /vel_cmd 被监视器 100Hz 接管，我们发什么都不被执行）
    # + 真正后退 2.5m 的飞行时间（nav max_vel 1.8 ⇒ ~1.5s）。取 2.5 会在监视器
    # 刚交还执行器的同一拍就取消撤退——那等于没撤。
    escape_hold_s: 4.0
    escape_clear_m: 0.6

    # (3) STUCK-SKIP 改造：把「跳点」变成「标危险盘 + 重规划」，原行为单局
    #     链式 12-16 次、吃光任务时间 ⇒ landed 低（§9.13 归因）。
    stuck_skip_hazard: true

    # (4) 出口 z 封顶（2026-10-06 补齐 z）。**封顶值不在这里**——直接读
    #     `competition_rules.yaml` `heights.flight_z_ceiling`（nav_node.py:222
    #     与 mission_executor_node.py:192 同源）⇒ 规则改了不会三处漂移。
    #     为什么路由器也要钳：ego 的 goal 已 remap 到本节点，**本节点是 ego 唯一
    #     的 goal 来源**；nav 的钳位只作用于 nav 自己那份局部 goal，不影响 ego。
    #     实测（G_1 d4）mission 的 hover-lock 目标 z=5.20（=机当时实测高度）被
    #     原样转发，而 OVER_HEIGHT 判据是**实测** z>5.0 持续 2s ⇒ 机停在超限高度；
    #     钳到 4.50 会让 ego 主动下降脱离违规区。0=不钳（nav 既有约定）。
    clamp_z: true
