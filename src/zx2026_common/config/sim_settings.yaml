  # ---- 全史碰撞聚类驱动的两项避障优化（2026-09-03，默认关） ----------------
  # 734 事件（python 706/131run + gazebo 28/6run）聚类：Top4 树占 41%
  # （tree#28 (-12.2,6.1) 一树 145 次=20%），主形态=分离硬推（障碍全盲）
  # 与云避障拔河，残余分量 + vcap 地板挤入接触；跟车同点连撞（gazebo
  # d5+d3 相隔 3.4s 同点）与窄点双向撞（tree#24 双向 dir）均此形态。
  # M3 sep_obs_guard：分离增量投影掉指向贴身障碍的分量（保切向）——
  # 机间防撞语义不变（树挡着时投影后推力为零=本就不可达）。
  # M4 hotspot_inflate：热点树所在格 +extra_cells 定向膨胀，A* 提前绕开；
  # 只加热点格，不重蹈全局 inflation 0.9 绕行超窗教训（batch1 判词）。
  sep_obs_guard:
    enabled: true           # 【2026-09-03 翻默认 true】A/B（run_logs/avoid_20260903_110806，
                            # seed 42/43/45 四臂同码，基准=rescue X 臂栈）：S 臂 3/3 PASS
