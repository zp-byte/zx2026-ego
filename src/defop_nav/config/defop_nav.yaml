# defop_nav.yaml — 全部参数，ns 无关命名。
# launch/defop.launch 用 <rosparam command="load"> 把本文件整包装进每个节点的
# 私有命名空间（~参数），各节点按需取用；launch 显式 <param>（drone_id/in_topic/
# goal_source/waypoint_file）优先级更高（同键覆盖）。
# 权重路径引用 ~/DeFoP 仓库内文件（不拷贝）；~/ 会 expanduser。

# ===================== 节点 1：defop_depth_fill（深度补洞） =====================
# 移植 img_filler.py fill_invalid_depth_robust 的参数（原版调用 kernel_size=100
# max_distance=3.0）
kernel_size: 100
max_distance: 3.0
close_threshold: 0.2      # "Pixels under 20 cm" 统计阈值
log_every: 15             # 统计日志节流（帧数）；0 关

# ===================== 节点 2：defop_vae_node（seVAE 编码） =====================
vae_weights: ~/DeFoP/src/planning/sevae/sevae/weights/seVAE_weights/seVAE_evo_LD_128.pth
latent_size: 128
device: cpu               # cpu | auto（auto=cuda 可用则 cuda:0）
image_height: 270
image_width: 480
depth_max_range: 10.0     # 米；>10 钳 10（vae_node.py 原值）
depth_min_valid: 0.2      # 米；<0.2 置 -1（原值）

# ===================== 节点 3：defop_cpn_node（CPN+监督+行为树） =====================
# ---- CPN 权重（3 集成；hdf5 weights-only，层名重建后 load_weights）----
cpn_weight_paths:
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett5/saved-model.hdf5
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett5/saved-model.hdf5
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett6/saved-model.hdf5

# ---- 基元库 / 网络维数（DeFoP config.py：PLANNING_TYPE=1 档）----
num_vel_x: 1
num_vel_z: 8
num_yaw: 32               # 1*8*32 = 256 基元
action_horizon: 15
action_shape: 3           # [vel_x, vel_z, yaw_rel]
state_shape: 6            # [vx,vy,vz,yaw_rate,roll,pitch]
cmd_velocity: 1.0         # vel_x 恒值（CMD_VELOCITY）
cam_pitch_deg: 0.0        # CAM_PITCH
fov_h_deg: 87.0           # PLANNING_HORIZONTAL_FOV
fov_v_deg: 50.0           # PLANNING_VERTICAL_FOV（DeFoP 规划常数；sim depth 渲染 vfov=58，监督器略保守）

# ---- 不确定性（config.py：N_E=3, USE_UT=True, ALPHA/BETA/L/K_UKF, P_v*) ----
n_ensemble: 3
use_ut: true
ut_alpha: 1.0
ut_beta: 2.0
ut_l: 3
ut_k: 0.0
p_vx: 0.16
p_vy: 0.16
p_vz: 0.16

# ---- 打分 / 死端（config.py）----
time_weight_factor: 0.04
# 打分尺度说明：CPN 输出=15 步 horizon 时间衰减加权和（Σw≈10.9），0-11.5 档，
# 非单步概率；deadend 阈值与此同尺度。collision_threshold 是相对 min_score
# 的带宽容差，与绝对尺度无关。
collision_threshold: 0.35
std_alpha: 0.05           # final = mean + 0.05*std（原版 L1271 硬编码）
deadend_high: 6.5         # DEADEND_COL_SCORE_THRESHOLD_HIGH
deadend_low: 5.0          # DEADEND_COL_SCORE_THRESHOLD_LOW

# ---- 几何监督器（filter_actions_by_grid_3；evaluate.py 实跑用 1.0/0.05/0.30，
#      此处取函数签名默认档，可按场地调）----
sup_min_dist: 1.5
sup_min_ratio: 0.02
sup_drone_radius: 0.32

# ---- 指令整形 ----
vel_y_gain: 0.5           # vel_y = gain * tanh(yaw_rel)（原版 0.5）
yaw_k: 1.0                # calculate_yaw_ctrl K_yaw
yaw_rate_limit_deg: 45.0  # ±pi/4（原版）

# ---- 航点 / 目标 ----
goal_source: topic        # topic | waypoint_file
waypoint_file: ""         # goal_source=waypoint_file 时必填；yaml: waypoints: [[x,y,z],...]
waypoint_distance_threshold: 3.0   # WAYPOINT_DISTANCE_THRESHOLD（2D）
waypoint_yaw_threshold_deg: 45.0   # WAYPOINT_YAW_THRESHOLD
allow_yaw_at_waypoint: true        # ALLOW_YAW_AT_WAYPOINT
goal_reach_dist: 0.8      # topic 模式：距目标 2D 小于该值 -> 原地悬停等新目标

# ---- 安全包络 / 断流（arena 契约；vel_bridge 侧还有全 3D 限幅+0.5s HOLD 双保险）----
vel_max: 1.2              # 水平模长上限（比赛首飞档）
z_min: 0.3                # 高度带下限（低于则禁负 vz）
z_max: 4.5                # 高度带上限=flight_z_ceiling（高于则禁正 vz；距 OVER_HEIGHT 5.0 保 0.5m）
vz_abs_max: 1.0           # |vz| 上限（CPN 基元 vz 最大约 0.47，正常不触）
stream_timeout: 1.0       # depth/latent 断流超时 -> HOLD 零速 + WARN 一次
plan_rate: 10.0           # 规划周期 Hz（CPU 推理慢时自动跳拍不堆积）
yaw_rate_spot_deg: 30.0   # 死端/航点对准的原地旋转速率档

# ---- odom 语义 ----
odom_twist_frame: world   # sim 插件 WorldLinearVel=world（源码定谳）；真机若 body 改 body

# ---- 降级 ----
allow_degraded: false     # true: TF/权重装载失败不退出，降级纯监督器模式（无 CPN 打分）
