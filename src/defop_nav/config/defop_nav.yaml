# ===== 【论文原值档】2026-09-30 跑批 =====
# cmd_velocity=1.0 (config.py CMD_VELOCITY) / sup=1.0,0.05,0.30
# (evaluate.py:1085 调用点实参) / vel_max=2.0 (VEL_MAX) /
# collision_settle_s=0.0 (论文无撞后镇定机制)
# 回滚=把这四行连同本横幅删掉，其余值改回 1.3/1.5,0.02,0.32/1.5/3.0
# defop_nav.yaml — 全部参数，ns 无关命名。
# launch/defop.launch 用 <rosparam command="load"> 把本文件整包装进每个节点的
# 私有命名空间（~参数），各节点按需取用；launch 显式 <param>（drone_id/in_topic/
# goal_source/waypoint_file）优先级更高（同键覆盖）。
# 权重路径引用 ~/DeFoP 仓库内文件（不拷贝）；~/ 会 expanduser。

# ===================== 节点 1：defop_depth_fill（深度补洞） =====================
# 移植 img_filler.py fill_invalid_depth_robust 的参数（原版调用 kernel_size=100
# max_distance=3.0）
kernel_size: 100
max_distance: 3.0
close_threshold: 0.2      # "Pixels under 20 cm" 统计阈值
log_every: 15             # 统计日志节流（帧数）；0 关

# ===================== 节点 2：defop_vae_node（seVAE 编码） =====================
vae_weights: ~/DeFoP/src/planning/sevae/sevae/weights/seVAE_weights/seVAE_evo_LD_128.pth
latent_size: 128
device: cpu               # cpu | cuda:0 | auto（auto=cuda 可用则 cuda:0）。
                          # 注意：defop.launch 的 <param name="device"> 会覆盖本键，
                          # 实际值由 --vae-device / 环境变量 VAE_DEVICE 决定（2026-10-01）。
image_height: 270
image_width: 480
depth_max_range: 10.0     # 米；>10 钳 10（vae_node.py 原值）
depth_min_valid: 0.2      # 米；<0.2 置 -1（原值）

# ===================== 节点 3：defop_cpn_node（CPN+监督+行为树） =====================
# ---- CPN 权重（3 集成；hdf5 weights-only，层名重建后 load_weights）----
cpn_weight_paths:
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett5/saved-model.hdf5
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett5/saved-model.hdf5
  - ~/DeFoP/src/planning/ORACLE/model_weights/VAE_EVO_back_to_origin/nett6/saved-model.hdf5

# ---- 基元库 / 网络维数（DeFoP config.py：PLANNING_TYPE=1 档）----
num_vel_x: 1
num_vel_z: 8
num_yaw: 32               # 1*8*32 = 256 基元
action_horizon: 15
action_shape: 3           # [vel_x, vel_z, yaw_rel]
state_shape: 6            # [vx,vy,vz,yaw_rate,roll,pitch]
cmd_velocity: 1.0         # vel_x 恒值（CMD_VELOCITY）；1.3=论文实测上限档（1.0 标称/1.3 探测档均 15/15 成功；2.0 仅为生成包线 VEL_MAX 非巡航值）
cam_pitch_deg: 0.0        # CAM_PITCH
fov_h_deg: 87.0           # PLANNING_HORIZONTAL_FOV
fov_v_deg: 50.0           # PLANNING_VERTICAL_FOV（DeFoP 规划常数；sim depth 渲染 vfov=58，监督器略保守）

# ---- 不确定性（config.py：N_E=3, USE_UT=True, ALPHA/BETA/L/K_UKF, P_v*) ----
n_ensemble: 3
use_ut: true
ut_alpha: 1.0
ut_beta: 2.0
ut_l: 3
ut_k: 0.0
p_vx: 0.16
p_vy: 0.16
p_vz: 0.16

# ---- 打分 / 死端（config.py）----
time_weight_factor: 0.04
# 打分尺度说明：CPN 输出=15 步 horizon 时间衰减加权和（Σw≈10.9），0-11.5 档，
# 非单步概率；deadend 阈值与此同尺度。collision_threshold 是相对 min_score
# 的带宽容差，与绝对尺度无关。
collision_threshold: 0.35
std_alpha: 0.05           # final = mean + 0.05*std（原版 L1271 硬编码）
deadend_high: 6.5         # DEADEND_COL_SCORE_THRESHOLD_HIGH
deadend_low: 5.0          # DEADEND_COL_SCORE_THRESHOLD_LOW
# ---- 死端旋转超时 / 退出迟滞（2026-10-02 立案，默认关）----
# 机制与判据见 docs/deadend_timeout_case.md；取值由影子批「回合时长直方图」
# 离线定，**不预设**。0.0 = 上游 evaluate.py:309-326 的两态 latch（逐字节旧行为）。
# 量纲锚点：yaw_rate_spot_deg=45°/s（批 4 抬起，原 30）⇒ 单向 8s 扫满 360°，故 max_s 若取秒级
# 已远超"扫一圈"所需；其价值不在搜到更多空间，而在把「无界零前进」变成
# 「有界零前进 + 有界前进（强制放宽）」。
# ⚠ 2026-10-02 定参（批2 专用档）：由影子批 defop_ab_20261002_115431 的**真机
# mode 线**直方图离线定（n=30 回合、3 格 seed43）：最短回合 <1s、p90=2s、max=4s。
# 规则先写死再见数（计划 §1）：hyst=最短正回合上取整、max_s=p90 的 4/6/8 最小可行档。
# 两键**同批同定**，禁单独调其一（迟滞方向与超时相反）。回滚=两键同写 0.0（逐字节旧行为）。
deadend_max_s: 4.0        # 状态1 持续该秒数 -> 状态2 强制放宽（接受被否决的最高分基元）
deadend_exit_hyst_s: 1.0  # 退出须**连续**满足低条件该秒数（治 <1s 的反复进出，实测最短 0.6s）
# ---- ③ 监督层否决率门（2026-10-02 立案，默认关）----
# 语义：`vf = veto/(veto+safe)` ≥ 本值 ⇒ 监督器自己判定「绝大多数方向不安全」
# ⇒ hi_ok 与 lo_ok **同**置假（判死端、且迟滞窗口不算数、不得退出），
# 直到监督器松口或 deadend_max_s 到点强制放宽。0.0 = 关闭 = 逐字节旧行为。
#
# 立案依据（批 5 defop_ab_20261002_135937，15 起碰撞中 ③ 占 9，9/9 同形）：
#   撞前 0.9~3.4s，障碍已进 `sup_min_dist=1.0m` 球内（dnear 1e3~7e4 像素），
#   监督器 veto 152~216/256（vf 0.59~0.85），**但 CPN 自己的分反而低**
#   （col_prob 0.50~5.53，**全在 deadend_high=6.5 之下**——近距离图像对
#   训练分布是 OOD）⇒ hi_ok 恒真 ⇒ 从不进死端 ⇒ `gov_scale` 减速到 0
#   却仍侧向滑进树。即：**监督器的自证信号完全没进决策链**。
# ⚠ 与批 3 的区别：批 3 是「整表按 β 重判」（DE 26→62、rot +80s、landed 破线）；
#   本键只在**监督器主动否决多数方向**时咬合。
#
# 取值由离线复算定（tools/sup33_replay.py：把候选门灌进**真机那份**
# _deadend_step_logic，在批 5 的 20927 条逐拍线上重放）：
#
#   X      dwell   死端占用(s)  相对基线   撞前已进死端的提前量
#   0.00   0.00         85.5    基线       12/15 起  min=0.33 p50=26.27
#   0.60   0.00        143.5   +67.9%      15/15 起  min=0.80 p50=1.71
#   0.60   0.30        125.5   +46.7%      15/15 起  min=0.84 p50=1.50   <= 取此档
#   0.70   0.30         95.4   +11.5%      13/15 起  min=0.69 p50=1.49
#
# 两条读数决定取值：①门槛提高几乎不降代价（0.60 vs 0.625：143.5 vs 143.2s），
# 因为掩膜本身是 `depth < sup_min_dist` 的硬门，vf 在障碍跨进 1.0m 那一拍就
# 从 0 阶跃到 0.45~0.84 ⇒ 代价杠杆是**回合数**，故加 dwell 滤"擦身而过"；
# ②覆盖是绑定约束：0.70 丢 2 起（③ 未解），0.60 全盖。代价 +46.7% 约为批 3
# （rot 62.8→142.8s，约 +94%）的一半 —— 批 3 是唯一标定过的"代价过高"点。
# ---- A/B 判词（批 6 defop_ab_20261002_143210）—— **判毙，已回 0.0** ----
# 对照 = 批 5 defop_ab_20261002_135937（同 seed43 三格、同插桩、门关）：
#            分(均)  landed  Σcol  minclr         DE(enter)  机制占比
#   批 5 门关  86.7     16     15    .282/.289/.35   18/20/22   ①2 ②4 ③9
#   批 6 门开  81.7     14      8    .228/.291/.277   28/24/36   ①0 ②6 ③2
#   逐格：00 `80/5/8`→`55/3/3`(PASS→FAIL) · 01 `90/5/3`→`90/5/1` · 02 `90/6/4`→`100/6/4`
# · 杀线破：**landed 16→14**（cell00 掉一档 verdict）。Σcol 不升 ✓（15→8）。
#   P4 余量两臂同为 2/3 超时（基线就如此）⇒ 不构成区分。
#   DE 实测 60→88 = **+46.7%**，与离线预登记 +46.7% 逐点吻合（复算器可信）。
# · ⚠ **根因被证实**：③ **9→2** —— 门确实把「监督器说危险、CPN 说安全」
#   那批现场全部接住了。**方向对，是幅度/出口错**。
# · ⚠ **出口是病灶**：残余从 ③ 挪到 ②（4→6），且 6 起 ② 的 `dt_死端`
#   = 0.996/1.030/1.058/1.076/1.152/1.338 s —— **全部 ≈ `deadend_exit_hyst_s`=1.0**。
#   机理：门咬合→原地转→障碍转出 1.0m 球/FOV 边缘→监督器不再否决→
#   lo_ok 连续满 1.0s→**退出死端→立刻右转回去撞上**。
#   （基线里 ② 也是 dt≈0.98/1.01 ⇒ 这条出口病**早已存在**，本门只是喂大了它。）
# ⇒ 下一候选方向：**出口**要另立判据（如"退出后 X 秒内不得重新进入"或
#   退出须同时满足"障碍不在近场"），而不是只靠监督器"不再喊"。
#   本批**不**再调 X/dwell 硬压（本仓"加大力度"的教训已三次）。
deadend_veto_frac: 0.0
# 上式须**连续**成立该秒数才咬合（滤"擦身而过"的一拍近场）。0.0 = 无迟滞。
deadend_veto_dwell_s: 0.0
# 【立案 2026-10-03 · 已实施、默认关】族① 死端几何触发（docs/deadend_geo_case.md）。
# 病根：近树图像 OOD ⇒ CPN 分低位（0.5~5.8 全在 deadend_high 之下）⇒ 现行门
# 只给 0.24~0.86s，收拢 1.37m/s 刹不住；残余碰撞 9/9~15/17 全在 CPN 持笔段。
# 修法：把「dmin<阈值 ∧ 收拢≥0.3m/s 持续 2 拍」并入 hi/lo（③ veto 同通道，
# hi/lo 必须同置假否则 <1s 抖动）。离线两局 18 样本：抓 15、提前量中位
# 1.53s（最差 0.86）；判别维度（az 锥角/closing 阈值）降不掉触发边沿
# ~1 次/分/机 = 本刀诚实成本。触发后 B2 硬零刹停 ⇒ closing→0 自清（不闩死），
# 退出仍走 lo 迟滞 1.0s；活锁兜底=deadend_max_s 4.0 强制放宽。
# 影子两档不传 geo_bad = 逐字节不变。A/B 臂=1.2；回滚=本键回 0.0。
# 【smoke 定谳 2026-10-03 判死回 0.0】defop_ab_20261003_005722（seed43, t≈221s 被会话
# 拆除杀局, 数据足够定性）：触发率 4.7/分/机=离线预测 4 倍（churn 乘数：出门即回进,
# 每次遭遇 3~6 圈 enter）；13 碰撞中 6 起发生在死端态**内部**（停转中仍撞=基线没有
# 的新签名）——放行→CPN 族①本性再逼近→0.4~0.6m 处再触发→刹不住。根因=出门钥匙
# lo_ok 正是族①的说谎信号（近树 CPN 分低位⇒lo 迟滞 1.0s 放行）⇒ 出门吃掉进门。
# 「触发-归还」式补丁在归还瞬间即被 CPN 本性逆转；修出门的候选（dmin 持有）退化成
# 每次触发 4s 强制翻转=过保守 9.4% 覆辙。详见 docs/deadend_geo_case.md smoke 节。
deadend_geo_dmin: 0.0     # 2026-10-03 smoke 判死；键保留, 代码默认关=逐字节旧行为
deadend_geo_close_mps: 0.3  # 收拢率阈值（c<=-本值才算逼近；0 防「贴着不动」活锁）
deadend_geo_dwell_n: 2   # 连续拍数（滤单拍噪声；离线口径=2）
# 【立案 2026-10-05 · 已实施、默认关】候选 1：死端门 `n_safe > 0` -> `>= 本值`。
# 病根：n_safe=len(indx1)=「CPN 认好 ∧ 监督器放行」的逃逸方向数。撞拍实测 31 起
# 的 n_indx1 全程 >0（r1 d4#1：116→99→…→15），只在线贴脸（dmin≈0.20m）才归零
# ⇒ 现行门只在接触瞬间开、反应窗为 0。改成 `>= 本值` 即把「还剩几条路」这条
# **平滑、提前约 3s 塌缩**的信号提前咬合。0 = 关闭 = 逐字节旧行为。
# 量纲锚点（离线重放 3 局 31 起撞的 n_indx1 曲线）：dmin=1.0m 处中位 ~25、
# dmin=0.5m 处 ~12 ⇒ 取 20 约在 dmin 0.8~1.2m 咬合（余量 0.8~1.2s）。
deadend_nsafe_min: 0
# 【立案 2026-10-05 · 已实施、默认关】候选 2：选择代价注入横向间隙项。
# 病根：第 7 步在 indx1 里只按 |yaw−goal_yaw| 选（最朝 goal），代价无横向间隙
# 项 ⇒ 直线路径贴着**偏轴**树擦过（撞拍实测 19/19 树在 ±43.5° 视场内、最近
# 接近拍机头方位恒 ±30~42°、机身半径 0.35m）。间隙代理=该基元航向扇区的监督器
# 否决率（全 256 口径，0=全放行/1=全否决）；yaw_cost += w·该项。
# 0.0 = 关闭 = 逐字节旧行为。
follow_clear_w: 0.0
# 候选 2 启用门：len(indx1) < 本值（危险）时才注入；<=0 = 恒启用（w>0 时）。
follow_clear_nsafe: 0
# 【立案 2026-10-03 · 已实施、默认关】近场记忆影（docs/near_field_memory_case.md）。
# 病根（B 案罪责表 25 起）：0.2m 拟真清零 + 填充背景穿树洞 ⇒ 树过 0.22m 一拍
# 「全清」（safe 256、col_prob 崩、gov 减速释放）→ 加速撞盲区，G-blind 10 起。
# 本影=监督器输入的影像系 min 池记忆（近 K 拍 <sup_min_dist 读数逐像素顶住
# 抹平），喂监督器/死端旋转方向/dbg/gov 四处；**VAE 路径零改动**。窗长律
# （mem6 先例）：1.0m→0.2m 收拢 1.0m/s ⇒ ≥0.8s；拍距 ~0.15s ⇒ K=6。K 帧
# 自然老化 ⇒ 旋转后残影过期 = 死端旋转逃 0.2m 死区的机制解。0 = 逐字节旧行为。
near_mem_frames: 0       # smoke 臂=6（预注册）；判毕回 0
# 影子 replica 的积分步长上限(s)：on_timer 在 nav 持笔/碰撞镇定窗**不执行**
# plan_once，其间隙不得整段充进状态时长（110544/00 d1：replica t_rot=7.7s
# vs 真机 mode 线 rot_s=0.72s，而该机直方图 max 仅 0.9s = 自相矛盾）。
# 定谳见 _clamp_dt。nominal 拍 0.05~0.1s ⇒ 0.5 已 5~10 倍余量；<=0 关闭。
sup_de_dt_cap_s: 0.5

# ---- 几何监督器（filter_actions_by_grid_3）----
# ⚠ 2026-10-01 订正：本段原注释写「回退 p3b 实证档（1.5/0.02/0.32）」，但
# 三键**从未落盘改过**——文件常年停在论文档 1.0/0.05/0.30（cmd_velocity 1.0 /
# vel_max 2.0 亦同档）。注释与取值不符，已按实测改写，不再声称做过没做的回退。
# G1 法证（2026-09-30）：1.0/0.05/0.30 搭 1.3m/s 后 col 均值 10.8→18.7
# （监督线砍 1/3 + 提速 30% 同时松绑 ⇒ 反应窗 0.72s）。1.0 是论文配
# TRT 10Hz 推理的参数。
# 2026-10-01 体半径订正（本轮）：sup_drone_radius 的 0.30 是**论文那台 0.4m
# 机架**的调用点实参（面内外接 ≈0.28），它不是我们这台的尺寸。本 sim 机体是
# world_builder 的 0.5×0.5×0.2 碰撞盒（半宽 0.25 / 面内外接 0.354），而判分用的
# gazebo_collision_monitor `_tree_hit`（`dxy < trunk_r + drone_radius`）与 nav 的
# 膨胀基（`inflation = drone_radius + 0.4`）**都取 0.35**。监督层的唯一职责是
# 否决「会撞」的动作，故必须与判据同径：0.30 → 0.35。
# 量化（fov_h 87° / num_yaw 32 ⇒ Δθ=2.719°，margin=ceil(atan(r/d)/Δθ)）：
# d=1.0m（sup_min_dist 硬否决边界）7→8 扇区、0.8m 8→9、0.6m 10→12、
# 0.4m 14→16；d≥1.2m 不变。即只在硬否决真正生效的 1m 内收紧。
# 回滚：tools/defop_cfg_preset.py paper|g1 会连带写回该键（见其 docstring 注）。
#
# ⚠ 2026-10-01 残余碰撞治理：1.0 → 1.5 试过，**判毙，已回退为 1.0**
# 法证（GPU r1 + 7 个固定态跑次 ×25 次残余碰撞，全部 kind=trunk）：
#   ① 25/25 碰撞前 3s 监督器**都在主动否决**（safe 常剩 80~144/256），
#      0 例"一片寂静"⇒**不是感知盲窗**；先前"末条 veto 距今 1.9s=盲窗"
#      的判断是 loginfo_throttle(2.0) 的假象，已撤回。
#   ② 全部为**贴干擦入**：撞点距干面 0.344~0.353（判据 0.35，吞入 ≤6mm）；
#      且 z 落在巡航带（0.96~1.40），非冠非枝。树干 trunk_h=5.2~9.5m，
#      **无"飞越"高度带**，cruise_z 不是变量。
#   ③ 机制算术：cmd_velocity 1.0 + yaw_rate_limit 45°/s ⇒ 转弯半径 v/ω=1.27m；
#      要在 1.0m 硬否决边界内攒出 0.35m 侧向偏移，需前进约 1.0m——
#      **零裕度**，再叠 latent 陈旧（4.4Hz⇒0.23s⇒0.23m）即净亏。
#      ⚠ 2026-10-02 订正：上式隐含的是 `yaw_rate_limit_deg`(45)，而**死端旋转档
#      另有其值** `yaw_rate_spot_deg`（立案时 30 ⇒ 实际半径 1.91m，比这里引用的
#      还差 50%）。两个数从未对齐过——歧义正藏在"转弯半径"这四个字里
#      （批 4 的靶子，见该键注释）。**批 4 已把它抬到 45** ⇒ 上式至此才对得上实际。
#   ④ 本键 1.0 是**论文配 TRT 10Hz 推理**的值（见上）。本链 CPN 实测 4.4Hz
#      （latent 供给），硬否决边界与推理周期不匹配是本案病根。
# 试改 1.5（GPU 臂 seed43，对 200409 的 1.0 档 3 局）。**2 格有效样本**：
#   1.0 档 r0 3/5/90/余量+32.9   →  1.5 档 r0 2/4/75/**−0.2 ★超时**
#   1.0 档 r1 4/6/100/余量+27.5  →  1.5 档 r1 1/4/85/**−0.0 ★超时**
#   （1.5 档 r2 格挂死无 verify.txt；补跑格被用户叫停，故为 2 样本非 3）
# 判定：**代价 > 收益，判毙**。col 省 1~3 次，代价是 landed −1~−2 架、
# score −15、**每局撞 250s 截断线**（1.0 档 3/3 有 +27~+36s 余量）。
# 机制与预登记一致：否决面变大 ⇒ DEADEND 变多 ⇒ 停走变多 ⇒ 有无人机
# 完不成任务（r1 cpn_duty_s 151.1→159.3、landed 6→4）。r0 的 minclr 反而
# 0.305→0.191 恶化，说明"提前否决"未稳定换来更干净轨迹。
# 结论：残余 2~4 次是反应式策略（1.0m/s + 1.27m 转弯半径）的**设计余量**，
# 非监督层可调平。若再压下，须走**不产生额外死端**的路子（候选：gov 带加宽，
# 只放宽侧向减速感知 ±14.5°，不碰 min_dist 硬否决边界），单独立案。
# ⚠ 跑批器缺陷（本批暴露）：CSV 的 timeout 列对 250s 截断**无感知**，两格
#   实测超时却写 False；须用外部 P4 核算对（本仓 /tmp/p4calc.py 可复用）。
sup_min_dist: 1.0
sup_min_ratio: 0.05
sup_drone_radius: 0.35

# ---- ④ 监督层几何口径（2026-10-01 立案；默认 off = 逐字节旧行为）----
# off    | 旧口径（上游 evaluate.py:614-615 逐字）：映射轴 yaw_lib ≡ 命令角 dyaw
# shadow | **不改发布出去的指令**，对同一张深度图另算一套 β 档掩膜，1Hz 只记
#          veto/死端**计数差**（零行为风险，用于取得真实场景的 Δ死端率）
# on     | 发布路径改用 β 档
#
# 【法证：为什么"命令角当方位"是错的】
#   filter_actions_by_grid_3 把障碍扇区映射到基元时用的是基元的**命令角
#   dyaw**（defop_common.py:274），而基元的**真实飞行航向**是
#   β = atan2(vel_y_gain·tanh(dyaw), cmd_velocity) = atan2(0.5·tanh(dyaw), 1.0)
#   （defop_cpn_node.py:_cmd_from_primitive）。dyaw 覆盖 ±39.15°，β 只有
#   ±16.53° —— **2.37 倍口径错配**。
#   **可复跑**：tools/defop_sup_geo_selftest.py（合成用针孔投影，与函数内部
#   同一相机模型）。45 格（孤立树干 × 方位{0..40°}/5° × 距离{0.5..0.95}m），
#   判据 = 判分器同款（垂距 < trunk_r 0.15 + drone_radius 0.35 = 0.50m）：
#     档     存活   HOLE(存活里会撞)   DEAD    FDEAD(误锁)
#     off    3104   1776 (57%)        4/45     0/45
#     on      888      0             33/45     3/45
#   典型格：树干正前 0.8m，off 档否决 208 个基元、**留下的 48 个全部会撞**。
#   on 档的 3 个误锁格，其物理安全航向只剩 8~32/256 —— 是保守扩张（±margin
#   扇区的 2D 矩形放大）在"近乎无路"几何里的对价，非方向误判；守卫 [C] 断言的
#   正是"误锁只出现在安全集稀缺处"，而非"零误锁"。
#
# 【为什么是"有意偏离上游"而不是移植 bug】
#   上游 evaluate.py:614-615（映射）与 :1489（vel_y=0.5*tanh(...)）与本仓
#   **逐字节相同**，上游亦无 asin/真方位修正分支。故本键是**有据偏离**，
#   且在 off 档下代码路径与上游一致（新参数全缺省）。
#   另有第二处：compute_margin 用 atan(r/d)（视在张角），净空锥应为
#   asin(r/d)。on 档走 compute_margin_cone；compute_margin 保持逐字不动
#   （tools/defop_sup_selftest.py 断言其 d≥1.2m 增量恒 0）。
#
# 【为什么默认 off：代价未测】
#   修正把可达航向锥压到 ±16.5°，合成死端率 4/45 → 33/45（同上守卫）。而
#   _deadend_action **无超时无迟滞**（has_deadend_in_segment 是死代码），
#   单次死端约 1.4~2.2s 零前进且可能震荡。**sup_min_dist 1.0→1.5 正是死在
#   同一机制上**（见上条，P4 余量 +27~36s → −0.2s）。故先影子对质取真实 Δep。
#
# 【判据（预登记，跑完即决）】预计新增零前进 ≈ (beta_ep − cur_ep) × 1.5s，
#   对照可用 P4 余量 +27~36s：
#     < 10s  ⇒ 翻 on，跑 3 局 A/B（杀线：P4 余量>0、landed 不掉、Σcol 降）
#     10–25s ⇒ 先给 _deadend_action 加超时+迟滞，再翻（单独立案，不同批归因）
#     > 25s  ⇒ 不翻，回报"代价超出预算"，保留参数化与守卫存档
# 【成本】shadow 档每拍多跑一遍监督器（dbg.sh_sup_ms 有读数）；off/on 无额外成本。
# 【取证】rosout 里 `sup_bearing_mode=` 是启动回声；`SHADOW bearing cyc=...` 是
#   1Hz 累计行（SIGKILL 吃 stdout 缓冲，故 1Hz 行才是主证据，SUMMARY 是加分）。
# 【影子跑批】把本键改 'shadow'，跑 3 局 seed43 --vae-device cuda:0
#   （与 1.0 对照臂 defop_ab_20261001_200409 同参数同 seed，可直接比 col/landed/P4），
#   再从每格 rosout.log 取末条 SHADOW 行汇总 Δep。（**已废止**：不再"跑完改回
#   'off'"，见下面的翻 on 条；本行留档防复提。）
# 【回滚】本键置 'off' + 重启节点即可；新参数缺省即旧行为，无需回退代码。
#
# ======== 定谳（2026-10-02）========
# 第一次影子批（run_logs/defop_ab_20261002_102658，3 局 seed43 GPU）用**代理** Δep 估代价：
#   Δep（β 档多出的死端回合／局·6机）= +9 / +10 / +15，×1.5s ⇒ 额外零前进 13.5/15.0/22.5 s
#   对照同参数 off 臂 20261001_200409 实测 P4 余量 +32.9 / +27.5 / +35.7 s
#   ⇒ 当时裁决：**先给 _deadend_action 加超时+迟滞，再翻**（不翻 on），本键回 'off'。
#
# ⚠ 本轮（2026-10-02 晚）取证**推翻了上述量级的两个依赖**：
#   ① 代理 Δep 与真机 deadend_step 不是同一件事（已接管回合内的空↔非空抖动
#      也计边沿，实测高估约 3×，见 _shadow_tick 注释）；
#   ② 取而代之的 replica 直测**自身有缺陷**——`plan_once` 在 nav 持笔/碰撞
#      镇定窗不执行，其间隙被整段充进状态时长（定谳见 _clamp_dt）。
#      110544/00 d1：replica t_rot_cur=7.7s vs 真机 mode 线 rot_s=0.72s，
#      而该机自己的直方图 max 仅 0.9s —— **自相矛盾**。
#   ⇒ Δt_rot 的绝对值与「+9.3s/格」一律**作废**；回合时长的权威源改为
#     **跑批探针的真机 mode 线直方图**（tools/defop_ab_run.py 的 hist/ep_max）。
#   ⇒ 本键当前 = 'shadow'（发布路径与 'off' 逐字节相同，_pub_kw={} 已核验），
#     供「影子批 → 定参 → 批2 → 翻 on」这条链继续用。
#
# ⚠ 两条方法论教训（勿再犯）：
#  1) **Δ 与余量必须同粒度**。汇总器一度拿"3 局 Δs 合计 51.0s"去比"单局余量
#     +27~36s"，自动报出 ">25s ⇒ 不翻" —— 那是口径混用。余量是 per-run 量，
#     Δ 也必须 per-run（13.5/15.0/22.5 s）或取均值（17.0 s）。
#  2) **影子仪器不是零成本**。近树几何下监督器单次 off 35.8ms / on 44.5ms，
#     shadow 每拍跑两次（净增 ~44ms）⇒ 可解释昨夜单格 vel_cmd 6.34→5.05Hz。
#     但今日 3 格 shadow 的 rtf/vel_hz 与 off 对照臂**无法区分**
#     （0.62~0.678 / 5.78~6.62Hz vs 0.641~0.65 / 6.17~6.34Hz）
#     ⇒ 昨夜那格是**跑次离群**，非系统效应。注意 on 档只调一次（≈off+8.7ms），
#     **翻 on 不存在时序代价**。
#  3) 已知局限（不影响上面的 Δep 判定，它是同帧对照）：shadow 臂 3/3 局各掉 1 架
#     （landed 5/5/5 vs 对照 5/6/6；P4 余量 −0.2/+12.5/−0.1 vs +27~36s），而发布
#     指令已证与 off 逐字节相同 ⇒ **成因未定**（仪器时序 or 跑次方差），小样本不
#     足以归因。
# 【立案 2026-10-02 · 已实施、默认关】_deadend_action 超时+迟滞+强制放宽。
#  ⓐ 更正「上游有、本仓丢」的误读：上游 evaluate.py:309-326 **同样**是
#     无超时无迟滞的两态 latch；上游唯一那处 has_deadend_in_segment 的**读**
#     在 evaluate.py:835（timeout_action 提前 FAIL，防两 yaw 模式抖动），本仓
#     移植因「A-ORACLE timeout 机制不移植」而丢弃 ⇒ 该标志"三写零读"是连带
#     结果，不是新缺陷。本案机制即其原意的接续。
#  ⓑ 更正 Δep 代理：代理 51/17 vs 真机 `DEADEND enter` 40/29 ⇒ **高估约 3×**
#     （边沿检测与真机 deadend_step 不是同一件事：已接管回合内的空↔非空抖动
#     也计边沿）。故影子档改为 replica **直测 sim 秒**（Δt_rot），Δep 只作旁证。
#  ⓒ 回合时长可零改码取证：/drone_N/defop/debug 逐拍无节流发 JSON，
#     dbg['mode'] ∈ {deadend_stop, deadend_rotate}。跑批探针已加订阅。
#  判据/杀线见 docs/deadend_timeout_case.md（A/B 预登记）。
#
# ======== 批 3 判决：翻 on **判毙**，已回 'off'（2026-10-02）========
# A/B：run_logs/defop_ab_20261002_125427（on） vs 121827（shadow），同 seed43 各 3 局。
#   |        | 分(均)   | landed | Σcol | DE  | FR  | rot_s  | forced_s | P4余量      |
#   | 批2 对照 | 290(96.7)|  17    |  9   | 26  | 11  |  62.8  |  17.0    | 80/ 5/25    |
#   | 批3 on   | 280(93.3)|  16    |  8   | 62  | 23  | 142.8  |  39.3    | 20/85/75    |
# **杀线破**：P4 余量>0 过、Σcol 不升 过、**landed 17→16 破** ⇒ 按预登记回 'off'。
# 机理归因（tools/defop_reactwin.py，Tier 2 逐拍线）：
#   ① 反应太晚 2→1 · ② 死端中仍撞 1→4 · ③ 监督层未拦住 8→3
# ⇒ β 修正**按设计工作**（③ 被治住 8→3），但代价原样出现：
#   监督层改用真实航向 β 判基元 ⇒ 原先"看着安全"的基元大批变"不安全"
#   ⇒ DE 26→62（2.4×）、rot 62.8→142.8s（+80s 零前进）、FR 11→23。
#   即本仓已量化的**边缘格误锁**（tools/defop_sup_geo_selftest.py：双树/宽障
#   叠加时存活基元 24→0），实弹按 2.4× 兑现。
# 净账：Σcol 9→8（−1，落在本仓同 seed 跑次方差的量级内）换 landed −1 / 分 −10。
#   按比赛目标（landed 即分）批 2 更优 —— 杀线破与目标劣两条独立理由同向。
# ⚠ 未结案：③ 仍是残余碰撞的**最大单一机制**（批 3 仍占 3/8）。本键回到 off
#   只是**撤回这一种实现**，不代表 ③ 无解；下一候选须避免"整档变保守"的副作用
#   （方向：只对**已被判安全却仍接近**的基元加约束，而非重判全表）。
# 回滚：本键回 'on' 即可复现批 3（但会带回 −10 分）。
sup_bearing_mode: 'off'

# ---- ② 预测性减速（前视变速；2026-09-30）----
# 硬否决（sup_*）只在 min_dist 内生效且**无前视**；本器自 gov_dist 起按
# 比例压水平模长，补上 2-5Hz 流水线吃掉的反应裕度（1.3m/s×0.4s=0.52m）。
# 只减速不改向、不动 vz；地板永不 0（dam v2/P2 磨树教训）。
# 代码缺省关（default_cfg gov_enable=False）；**本工作文件当前置 true**（未提交，
# 属独立于本案的待议项，本轮 A/B 全程不动它以免混档）。false 时逐字节旧行为。
# 预设切换 tools/defop_w3_gov_preset.py
gov_enable: true
gov_dist: 2.0             # 前视距离(m)：进入此距离开始减速
gov_stop: 0.35            # 地板开始咬合的距离(m)
gov_floor: 0.45           # 速度下限比例（对齐 nav _apply_vcap 地板思想，永不 0）

# ---- 指令整形 ----
vel_y_gain: 0.5           # vel_y = gain * tanh(yaw_rel)（原版 0.5）
yaw_k: 1.0                # calculate_yaw_ctrl K_yaw
yaw_rate_limit_deg: 45.0  # ±pi/4（原版）

# ---- 航点 / 目标 ----
goal_source: topic        # topic | waypoint_file
waypoint_file: ""         # goal_source=waypoint_file 时必填；yaml: waypoints: [[x,y,z],...]
waypoint_distance_threshold: 3.0   # WAYPOINT_DISTANCE_THRESHOLD（2D）
waypoint_yaw_threshold_deg: 45.0   # WAYPOINT_YAW_THRESHOLD
allow_yaw_at_waypoint: true        # ALLOW_YAW_AT_WAYPOINT
goal_reach_dist: 0.8      # topic 模式：距目标 2D 小于该值 -> 原地悬停等新目标

# ---- 安全包络 / 断流（arena 契约；vel_bridge 侧还有全 3D 限幅+0.5s HOLD 双保险）----
vel_max: 2.0              # 水平模长上限（cmd 1.3 时 h_max~1.39 不咬合，兜底档；vel_bridge 另有 2.0 全 3D 限幅）
z_min: 0.3                # 高度带下限（低于则禁负 vz）
z_max: 4.5                # 高度带上限=flight_z_ceiling（高于则禁正 vz；距 OVER_HEIGHT 5.0 保 0.5m）
vz_abs_max: 1.0           # |vz| 上限（CPN 基元 vz 最大约 0.47，正常不触）
collision_settle_s: 2.5   # ③碰撞镇定：/collision 上升沿 -> HOLD 零速该时长；
                          # 对齐恢复链 bounce 1.0+cooldown 2.0 窗口，交笔回来再复规划
stream_timeout: 1.0       # depth/latent 断流超时 -> HOLD 零速 + WARN 一次
plan_rate: 10.0           # 规划周期 Hz（CPU 推理慢时自动跳拍不堆积）
# ---- 批 4（2026-10-02）：死端旋转速率 30 → 45°/s —— **已收 · 过线 · 翻默认** ----
# A/B：run_logs/defop_ab_20261002_132328（45） vs 121827（30），同 seed43 各 3 局。
#   |        | 分(均)    | landed | Σcol | DE | FR | rot_s  | forced_s | P4余量       |
#   | 批2 (30) | 290(96.7) |  17    |  9   | 26 | 11 |  62.8  |  17.0    | 80/ 5/25     |
#   | 批4 (45) | 300(100.0)|  18    |  7   | 21 | 12 |  39.9  |  20.1    | 85/35/10     |
# **杀线全过**：P4 余量>0（min 10s）· landed 17→**18** · retired 0→0 · Σcol 9→**7**
#   · stuck 不升（STUCK 149→150，STALL 41→34）⇒ **按预登记翻默认**。
# **主锚点达成**：cell01 的 P4 余量 **5→35s**（六倍）——这正是立案理由所在。
# 逐格：00 col 4→2（rot_s 17.2→7.4 腰斩，DE 8→5）；01 col 2→3（唯一反向）；
#   02 **90→100 / landed 5→6 / col 3→2 / DONE 265→225s**。
# 机理（reactwin Tier 2）：① 反应太晚 **1→0**（本批零例）· ② 1 · ③ 6。
# 取值依据：抬到**已声明的** `yaw_rate_limit_deg`(45)，用现有余量、不越限。
#   v/ω：1.0/0.524=1.91m → 1.0/0.785=1.27m（**−34%**），**速度不变**。
#   与 `deadend_max_s=4.0` 同向：4s 内扫角 120°→180°。
# 为何走 ω 不走 v：全仓改 v 的候选屡败（gov_dist / vcap / sup_min_dist / dam v1v2 /
#   near_stop_zone / ca_iso_floor），判词「速度地板是暴露时长调节器，不是安全项」。
#   改 ω 不降速 ⇒ 不进该族。这是本候选的核心优势。
# 基线 = 批 2（off/4.0/1.0/30.0）——批 3 的 β 已判毙回 off，故工作区与批 2 逐字节同，
#   本批只动这一个自变量 ⇒ 效应 = 批4 − 批2。
# ⚠ **效应幅度须照实读**：Σcol 9→7 仍落在本仓同 seed 跑次方差的量级内（历史 1–10）；
#   分 290→300 主要由 **cell02 单格掉机修复**贡献。**稳健信号是「无任一轴退化」
#   + cell01 余量 5→35s + cell00 rot_s 腰斩**，而非裸 Σcol 差。
# ⚠ 下限风险：45°/s 是拿 `yaw_rate_limit_deg` 做上限，**真机能否跟上仍未验**
#   （该值属"原版"遗留、非实测标定）；真机若欠驱动/姿态超调须回退重标。
# ⚠ ① 只治"来不及转"，不治"该不该转"：**③ 监督层未拦住仍是最大单一机制
#   （本批 6/7）**，批 3 已证伪"整表按 β 重判"这一种实现；下一候选须另立案。
# 回滚：本键写回 30.0（单键，无副作用）。
yaw_rate_spot_deg: 45.0   # 死端/航点对准的原地旋转速率档（批 4：30→45，v/ω 1.91→1.27m）

# ---- odom 语义 ----
odom_twist_frame: world   # sim 插件 WorldLinearVel=world（源码定谳）；真机若 body 改 body

# ---- 降级 ----
allow_degraded: false     # true: TF/权重装载失败不退出，降级纯监督器模式（无 CPN 打分）
